# One record per significant capability or requirement.
# Keep the record small; point to canonical artifacts instead of duplicating their content.

record_id: ELO-TRACE-XXX
record_type: capability|requirement|contract|change
subject_id: ELO-CAP-XXX
subject_name: <name>

semantic:
  layer: enterprise|architecture|process|knowledge|cognitive|data|ai|governance|system|roadmap
  owner: <owner>
  status: proposed|draft|normative|implemented|tested|verified|deprecated|superseded|blocked
  authority: constitutional|baseline|adr|policy|contract|implementation|test|reference|proposal
  maturity_level: 0

traceability:
  canonical_artifact: <path>
  requirements: []
  contracts: []
  adrs: []
  implementations: []
  tests: []
  evidence: []
  dependencies: []

