[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elo-prototype"
version = "0.1.0"
description = "ELO executable cognitive prototype"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.110,<1.0", "pydantic>=2.0,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
agentic = [
    "langgraph>=0.2,<2.0",
    "langchain>=0.3,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
