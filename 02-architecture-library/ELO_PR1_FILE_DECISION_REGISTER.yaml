purpose: >-
  Record an explicit classification and destination decision for every changed
  file in historical PR #1. The register prevents accidental promotion of the
  historical ELO/ runtime into the current src/elo/ implementation root.

classification_vocabulary:
  - REUSE
  - ADAPT
  - SUPERSEDE
  - HISTORICAL
  - REJECT

rules:
  - Every PR1 changed file has exactly one classification below.
  - Grouping is not used; every path is explicitly enumerated.
  - No historical executable file is promoted solely by naming similarity.
  - Security, tenancy, persistence, autonomy, and public contract changes require explicit review.
  - Historical material may be retained for provenance without becoming implementation authority.
  - A later promotion requires contract comparison, tests, and evidence.

