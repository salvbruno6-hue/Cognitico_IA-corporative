# ELO Capability Registry
#
# Operational companion to ELO_BASELINE_MATURITY_AND_TRACEABILITY_FRAMEWORK.md.
# This registry is intentionally conservative: it records the initial inventory
# without claiming implementation maturity that has not been evidenced.
#
# Status vocabulary follows ELO_ARTIFACT_METADATA_STANDARD.md.
# Maturity: 0 absent, 1 conceptual, 2 documented, 3 contracted,
# 4 implemented, 5 tested, 6 verified, 7 operationally evidenced.

schema_version: "0.1"
registry_id: ELO-REG-CAP-001
status: proposed
authority: proposal
last_reviewed: "2026-08-11"

rules:
  - "Do not promote maturity without evidence."
  - "Do not create duplicate capabilities under different names without an ADR."
  - "A capability entry is not proof of implementation."
  - "If evidence is missing, record the gap instead of inferring success."
  - "Use canonical_artifact to identify the primary source of meaning."

