schema: ELO-FORGE-SKILL-PACK.v1
owner: Forge
authority: ELO_COGNITIVO
shared_faculty: Core
promotion_gate: Evolution_Gate

skills:
  - skill_id: FORGE-BUDGETING-001
    domain_family: BUDGETING
    authority_role: SPECIALIZED_FORGE_EXECUTOR
    purpose: >-
      Executar raciocínio técnico-orçamentário rastreável, composição e precificação,
      explicar como cada decisão e valor foi construído e transformar experiências
      repetidas em aprendizado candidato sem criar autoridade paralela ao ELO/Governance.
    scope: >-
      Setor de Planejamento, domínio Orçamento: leitura de SO/TR, PTS Técnica,
      enquadramento de produto/modelo, equivalência, quantitativos, composição,
      mão de obra, logística, custos, PTS Pós-Orçamento, resolução dos indicadores
      canônicos, memória de cálculo e aprendizado cognitivo contínuo.
    boundaries: >-
      Não inventa quantidade, fórmula, preço, produtividade ou aplicabilidade; não
      promove precedente a regra automaticamente; não substitui documentação vigente,
      Lista-Mãe, contratos canônicos nem memória persistente autorizada; não deve ser
      apresentada ao usuário como Skill canônica ou autoridade normativa independente.
    prerequisites:
      - documentação vigente da SO/projeto quando existir
      - prompts/ELO_ORCAMENTO_EXECUTION_CONTRACT.yaml
      - 08-ai/ELO/DIRETRIZES/ELO_DIRETRIZ_MESTRA_ESPECIALISTA_ORCAMENTO.md
      - 08-ai/ELO/ESPECIALISTAS/ORCAMENTO/SKILL.md
      - 08-ai/ELO/ESPECIALISTAS/ORCAMENTO/APRENDIZADOS/ELO_APRENDER_CANONICO_MASTER_PROMPT.md
      - 08-ai/ELO/ESPECIALISTAS/ORCAMENTO/APRENDIZADOS/ELO_ORCAMENTISTA_APRENDIZADO_CONTINUO.md
    authorized_inputs:
      - SO
      - TR_EDITAL
      - PTS_TECNICA
      - ORCAMENTO
      - PTS_POS_ORCAMENTO
      - INDICADORES_PTS_POS
      - PLANILHAS
      - COMPOSICOES
      - DOCUMENTOS_ANEXOS
      - CORRECOES_EXPLICITAS_DO_OWNER
    authorized_sources:
      - GitHub canônico Cognitico_IA-corporative
      - Supabase elo_orcamento_memoria
      - Supabase elo_orcamento_calculos_aprendidos
      - Supabase elo_orcamento_calculo_varreduras
      - Supabase elo_orcamento_calculo_evidencias
      - Supabase elo_orcamento_calculo_similaridades
      - Supabase elo_orcamento_decisoes
      - Supabase elo_orcamento_associacoes
      - Lista-Mãe e fontes autorizadas de preço
    procedures:
      - ao iniciar ELO ANALISAR, ativar internamente FORGE-BUDGETING-001 para a SO atual
      - manter a ativação interna silenciosa na resposta inicial ao usuário
      - consultar conhecimento armazenado no Git e memória orçamentária no Supabase antes de compor
      - requisito -> interpretação -> alternativas -> decisão técnica
      - identificar padrão/modelo antes de excedente
      - reconstruir quantitativo e dependências
      - recuperar precedentes e confrontar equivalência sem aplicá-los silenciosamente
      - separar quantitativo, preço unitário, custo, indiretos e preço final
      - manter rastro de raciocínio por fase da elaboração do orçamento
      - confrontar PTS Técnica -> Orçamento -> PTS Pós-Orçamento
      - resolver os indicadores canônicos Conhecimento, Flexibilidade, Risco e Decisão
      - executar auditoria reversa dos principais valores até requisito/solução/origem
      - no encerramento, explicar como o orçamento foi pensado e como os valores foram definidos
      - no encerramento, retornar ao owner no mínimo 10 perguntas adaptativas de aprendizado
      - após respostas do owner, classificar integração como CASE, PRECEDENT, LEARNING_CANDIDATE ou VALIDATED_LEARNING conforme governança
      - quando acionado ELO APRENDER, executar varredura cognitiva e cognitive merge governado
    calculation_methods:
      - preservar entrada + unidade + premissa + fórmula + subcálculo + resultado
      - recomputar quantitativos quando houver parâmetros suficientes
      - registrar GAP_FORMULA_QUANTITATIVO quando existir resultado sem fórmula demonstrável
      - validar preços unitários contra fonte vigente antes do custo
      - distinguir quantidade informada, calculada, adotada e orçada
      - reconstruir valor -> item -> composição -> quantitativo -> preço unitário -> fonte -> requisito
    evidence_requirements:
      - FACT
      - COMMITTED
      - AVAILABLE
      - ASSUMPTION
      - ESTIMATE
      - HYPOTHESIS
      - GAP
      - CONFLICT
    provenance_requirements:
      - origem_so
      - origem_documento
      - item_origem
      - pts_tecnica_ref
      - ref_orcamento
      - fonte_do_preco
      - formula
      - premissas
      - validacao
    uncertainty_rules:
      - experiência única inicia como OBSERVADO/CANDIDATO
      - associação recorrente gera alerta de verificação, não inclusão automática
      - preço histórico é referência consultiva, não preço vigente
      - sem evidência suficiente preservar GAP
      - pergunta de aprendizado não equivale a autorização de integração
      - resposta do owner alimenta candidato, não promoção automática ao Core
    escalation_rules:
      - conflito documental material -> ELO/Governance
      - ausência de preço vigente material -> questionamento/cotação
      - divergência PTS Técnica x Orçamento x PTS Pós sem explicação -> contestação
      - regra candidata com impacto recorrente -> validação antes de promoção
    outputs:
      - mapa cognitivo do orçamento
      - composição rastreável
      - memória de cálculo
      - rastro de raciocínio por fase
      - explicação de como cada valor relevante foi definido
      - confronto PTS Técnica x Orçamento x PTS Pós-Orçamento
      - resolução dos indicadores Conhecimento, Flexibilidade, Risco e Decisão
      - divergências e riscos
      - padrões candidatos
      - alertas de dependências
      - PTS Pós-Orçamento
      - questionário final de aprendizado com no mínimo 10 questões
      - proposta de integração de aprendizado sujeita à resposta do owner e governança
    decision_boundaries:
      - não executa compra ou contratação
      - não altera preço canônico sem fonte autorizada
      - não promove aprendizado diretamente ao Core
      - não transforma caso histórico em origem da SO atual
      - não integra automaticamente à Skill uma resposta ainda não validada
      - não expõe ID da Skill, infraestrutura ou memória interna na ativação ao usuário salvo pedido explícito
    test_references:
      - tests/validation/test_budgeting_specialist_skill.py
      - tests/validation/test_budgeting_continuous_learning.py
    maturity: STRUCTURED
    version: "1.2"
    history:
      - "2026-10-30: formalização no Forge reutilizando a Skill de Orçamento existente"
      - "2026-10-30: ativação automática no ELO ANALISAR, rastro de raciocínio e revisão de aprendizado >=10 questões"
      - "2026-10-30: ativação interna silenciosa; resposta inicial orientada à SO sem expor implementação"
    contextual_parameters:
      sector: Planejamento
      auto_activate_on: ELO ANALISAR
      activation_visibility: INTERNAL_SILENT
      expose_skill_id_on_activation: false
      expose_infrastructure_on_activation: false
      forge_skill_is_canonical_authority: false
      remain_active_until: encerramento da solicitação e revisão de aprendizado
      learning_trigger: ELO APRENDER
      minimum_learning_questions: 10
      learning_questions_are_adaptive: true
      reasoning_trace_required: true
      stored_knowledge_lookup_required: true
      pts_chain_required: PTS_TECNICA -> ORCAMENTO -> PTS_POS_ORCAMENTO
      canonical_pts_pos_indicators:
        - Conhecimento
        - Flexibilidade
        - Risco
        - Decisão
      reasoning_chain: >-
        REQUISITO -> EVIDENCIA -> INTERPRETACAO -> ALTERNATIVAS -> DECISAO ->
        QUANTITATIVO -> DEPENDENCIAS -> FORMULA -> PRECO/FONTE -> CUSTO ->
        PTS_POS/INDICADORES -> VALIDACAO -> APRENDIZADO
      explanation_chain: >-
        O_QUE_FOI_PEDIDO -> O_QUE_FOI_ENTENDIDO -> O_QUE_FOI_ESCOLHIDO ->
        POR_QUE_FOI_ESCOLHIDO -> COMO_FOI_CALCULADO -> DE_ONDE_VEIO_O_PRECO ->
        COMO_CHEGOU_AO_VALOR -> O_QUE_FOI_VALIDADO -> O_QUE_FICOU_EM_GAP
      example_candidate:
        context: contêiner 20 pés padrão com forração PIR 32 mm
        wall_panels_observed: 14
        ceiling_panels_observed: 5
        status: CANDIDATO
        required_gap_if_formula_missing: GAP_FORMULA_QUANTITATIVO
        dependency_alert: verificar guia U/perfis de fixação e acabamento
    learning_candidates:
      - padrões condicionais de composição
      - fórmulas de quantitativos recorrentes
      - dependências técnicas de instalação
      - produtividade recorrente com contexto comprovado
      - critérios de equivalência e escolha de modelo
      - sequência de decisões que explica formação de custo
      - divergências recorrentes entre PTS Técnica e orçamento
      - padrões de indicador da PTS Pós associados a decisões repetidas
    promotion_candidates:
      - somente métodos generalizáveis validados por múltiplas evidências e Evolution Gate

rules:
  direct_forge_to_core_promotion: false
  company_overlay_is_generalizable_by_default: false
  historical_experience_is_immutable: true
  external_source_is_authority: false
  precedent_is_rule_by_default: false
  learning_question_is_permission_to_promote: false
