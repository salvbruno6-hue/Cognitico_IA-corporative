version: "1.4"
contract_id: ELO-ORCAMENTO-EXECUTION-001
purpose: "Contrato físico para execução assistida de orçamento no ambiente do especialista, com varredura de recorrências, confronto composição-base × memórias específicas e despacho automático de candidatos ao owner canônico de governança."
mode: supervised
canonical_sources:
  - documentation/SO
  - PTS_TECNICA
  - Lista-Mãe
  - taxonomy/MLT
  - model_specifications
  - compositions
  - labor
  - relations
  - budget_recurring_catalog
  - calculation_memory
  - PTS_POS_ORCAMENTO
pipeline:
  - id: intake
    action: normalize_request
  - id: pts_technical
    action: resolve_pts_technical_requirements
  - id: recurring_scan_pre_budget
    action: scan_recurring_items_and_services_for_applicability
    mandatory: true
    semantics: "recurrence_is_verification_not_auto_inclusion"
  - id: master_list
    action: resolve_master_list_items
  - id: taxonomy
    action: classify_mlt_family
  - id: model_match
    action: match_canonical_model
  - id: delta_detection
    action: detect_excess_items
  - id: relation_audit
    action: resolve_interconnections
  - id: composition_memory_reconciliation_pre_budget
    action: reconcile_base_compositions_with_specific_memories
    mandatory: true
    sequence:
      - open_base_composition
      - classify_each_component_by_execution_stage
      - search_specific_related_memories
      - compare_summary_text_with_structured_components
      - detect_embedded_or_complementary_costs
      - resolve_or_raise_conflict
  - id: composition_build_pre_spreadsheet
    action: specialist_build_or_reconcile_missing_compositions
    mandatory: true
    owner: budget_specialist
    after: composition_memory_reconciliation_pre_budget
    before: specialist_gate
    source_precedence: [documentation_SO, canonical_model_composition, lista_mae, specific_memory, validated_external_quote]
    service_classifications: [EXISTENTE_COMPATIVEL, ADAPTAVEL, PARCIAL, INEXISTENTE, CONFLITANTE]
    line_operations: [REUTILIZADA, SUBSTITUIDA, ADICIONADA, EXCLUIDA, PENDENTE]
    required_fields: [service_id, item_reference, description, unit, quantity, quantity_evidence, unit_price, price_source, total_cost, base_reconciliation, validation_status]
    safeguards:
      - reuse_existing_compositions_before_creating
      - calculate_only_missing_or_changed_parts
      - distinguish_consumption_from_purchase_packaging
      - validate_code_description_unit_and_price_together
      - treat_zero_or_missing_price_as_gap_not_confirmed_free
      - retain_external_quote_provenance_without_master_list_mutation
      - reconcile_labor_and_execution_stages_without_double_count
      - record_dependencies_as_checks_not_auto_inclusions
      - do_not_promote_case_experience_to_core
  - id: specialist_gate
    action: request_specialist_validation_when_needed
  - id: composition_pre_spreadsheet_gate
    action: validate_compositions_before_final_spreadsheet
    mandatory: true
    owner: budget_specialist
    after: specialist_gate
    results: [PASS, REVIEW, BLOCKED]
    pass_requires: [scope_covered, quantities_and_units_verified, price_provenance, labor_evidence, no_unresolved_double_count, critical_decisions_arbitrated]
    blocked_on: [unresolved_critical_gap, conflicting_item_identity, incompatible_technical_solution, material_double_count]
    review_output: full_canonical_base_master_in_chat_marked_provisional
    blocked_output: full_canonical_base_master_in_chat_marked_blocked_with_gaps
    final_spreadsheet_requires: PASS
  - id: canonical_budget_master_render
    action: assemble_and_display_current_canonical_budget_base_master_in_chat
    mandatory_on_trigger: "elo orçar"
    owner: budget_specialist
    after: composition_pre_spreadsheet_gate
    before: budget_decision
    canonical_template: "Planilha de Orçamento — Base Mestre vigente"
    required_sections: ["0 Controle", "1 Comercial", "2 Serviços/Materiais/Mão de Obra", "3 Fechamento", "4 Observações"]
    preserve: [original_columns, taxonomy, units, formulas, calculation_rules]
    display: full_in_conversation_before_file
    no_parallel_template: true
    gate_handling:
      PASS: "display validated canonical budget"
      REVIEW: "display full canonical budget marked provisional with pending fields; do not approve final"
      BLOCKED: "display full canonical budget marked blocked with GAPs and pending fields; do not approve final"
    missing_evidence: "PENDENTE/NA, never invented value or implicit zero"
    file_creation: "only_on_separate_explicit_request_after_gate_PASS"
  - id: budget_decision
    action: produce_budget_decision
  - id: pts_post_budget
    action: audit_budget_against_pts_technical
  - id: recurring_scan_post_budget
    action: rescan_recurring_items_and_services_against_budget
    mandatory: true
    classifications:
      - ATENDIDA
      - NAO_APLICAVEL
      - OMITIDA
      - DUPLICADA
      - PENDENTE_VALIDACAO
      - NOVA_ASSOCIACAO_CANDIDATA
  - id: composition_memory_reconciliation_post_budget
    action: recheck_budget_items_against_specific_memories
    mandatory: true
    classifications:
      - INTEGRADO_NA_COMPOSICAO
      - COMPLEMENTAR_SEPARADO
      - DUPLICIDADE
      - CONFLITO_DE_MEMORIA
      - PENDENTE_VALIDACAO
  - id: learning_review
    action: generate_case_specific_learning_questions
    mandatory: true
    blocking: true
    minimum_questions: 10
    close_only_when: "learning_review_questions_emitted_or_case_explicitly_left_open"
  - id: learning_governance_dispatch
    action: dispatch_classified_learning_to_canonical_governance
    mandatory: true
    automatic_on: learning_review_completed
    canonical_owner: src/elo/core/learning_governance.py
    classifications:
      CASE: retain_case
      PRECEDENT: retain_reference
      LEARNING_CANDIDATE: evaluate_without_auto_approval
      VALIDATED_LEARNING: reuse_existing_validated_learning
      GAP: retain_blocked
      CONFLICT: retain_blocked
    promotion:
      human_approval_required: true
      evolution_gate_required: true
      auto_approval: false
      auto_promotion: false
  - id: correction_loop
    action: return_to_budget_when_material_divergence_exists
    repeat_until: "material_divergences_resolved_justified_or_arbitrated"
  - id: learning
    action: evaluate_dispatched_candidates_without_auto_promotion
triggers:
  analysis_request: ["elo analisar", "ELO ANALISAR"]
  budget_request: ["elo orçar", "ELO ORÇAR", "orçar", "orcamento", "montar orçamento", "levantar orçamento"]
  pts_technical_request: ["pts tec", "pts técnica", "criar pts técnica"]
  pts_post_request: ["pts pos", "pts pós", "pts pós-orçamento", "criar pts pós"]
  comparison_request: ["comparar valores", "comparar orçamento", "diferença de preço"]
  master_list_update: ["nova lista-mãe", "atualizar lista mãe", "novo item MLT"]
  relation_request: ["interligação", "composição", "dependência", "conexão", "recorrente", "aplicação"]
rules:
  canonical_model_price: "Se houver preço fechado vigente na Lista-Mãe, não estimar nem substituir automaticamente."
  excess_items: "Itens que excedam a composição do modelo devem virar linhas explícitas do orçamento."
  relations: "Interligações elétricas, nivelamento, apoio, munck e equivalentes devem ser auditáveis e cobrados do especialista quando a decisão depender de contexto."
  recurring_scan: "Toda PTS Técnica e toda PTS Pós-Orçamento deve executar varredura de serviços/itens recorrentes e suas dependências."
  recurring_semantics: "Item recorrente gera alerta/verificação de aplicabilidade; nunca inclusão automática de escopo, quantidade ou preço."
  recurring_source: "Usar o catálogo do Especialista para saber o que procurar; usar memória estruturada e fonte vigente para saber como calcular e quanto custa."
  pts_technical_gate: "PTS Técnica sem varredura de recorrências e sem confronto composição↔memórias é incompleta para entrada do orçamento."
  pts_post_gate: "PTS Pós sem segunda varredura e sem novo confronto composição↔memórias é incompleta para fechamento."
  learning_review_gate: "Quando ELO ANALISAR chegar ao fechamento da solicitação, não considerar a análise encerrada sem emitir REVISÃO DE APRENDIZADO DA SO com no mínimo 10 perguntas específicas ao caso; se a solicitação permanecer aberta, registrar explicitamente que o questionário fica pendente para o fechamento."
  post_analysis_learning_governance: "Após a revisão de aprendizado ser respondida/classificada, ELO ANALISAR deve despachar automaticamente CASE/PRECEDENT/LEARNING_CANDIDATE/VALIDATED_LEARNING/GAP/CONFLICT ao owner canônico de learning_governance. O despacho é automático; aprovação e promoção nunca são automáticas. LEARNING_CANDIDATE entra em avaliação; promoção exige evidência, threshold, aprovação humana explícita e Evolution Gate."
  correction_loop: "Divergência material encontrada na PTS Pós retorna ao orçamento; após correção, gerar nova PTS Pós e repetir varredura e confronto."
  labor_nature: "Distinguir MO-FAB, MO-INST e MO-EXT; mão de obra presente em uma composição não prova que instalação esteja incluída."
  evidence_hierarchy: "Para decidir se uma etapa está incluída, priorizar composição detalhada e memórias específicas relacionadas sobre texto-resumo genérico ou ambíguo."
  specific_memory_rule: "Se existir memória específica para uma etapa, como instalação, e a composição-base não contiver linha inequívoca dessa mesma etapa, tratar a memória específica como parcela complementar; não presumir integração pelo texto-resumo."
  no_double_count: "Antes de somar memória complementar, verificar se a mesma etapa já aparece explicitamente na composição-base; se aparecer, classificar como possível duplicidade e reconciliar."
  conflict_rule: "Quando texto-resumo, composição detalhada e memória específica divergirem, marcar CONFLITO_DE_MEMORIA e levar ao especialista/questionário; não escolher silenciosamente."
  door_example: "MC-PORTA-EXTERNA-CORTEN-800X2100 = R$ 600,22 de materiais/fabricação/acabamento; MC-INSTALACAO-PORTA-METALICA = R$ 118,15 de instalação quando aplicável. A memória específica impede presumir instalação embutida no valor-base."
  logistics_consistency: "Quando houver mão de obra externa, confrontar dias de equipe, carro de apoio, veículos, rota/pedágio e hospedagem por pernoite, conforme aplicabilidade."
  uncertainty: "Questão não compreendida deve ser agrupada como variação para posterior aprendizado; não inventar regra."
  experience: "Experiência só pode ser promovida após avaliação de valor, evidência, recorrência e identidade canônica."
  structural_change: "Mudança estrutural exige Evolution Gate e aprovação apropriada."
  temporal_memory: "Aprendizado de experiência permanece temporal até promoção canônica."
outputs:
  - pts_technical_recurring_audit
  - composition_memory_reconciliation
  - structured_budget
  - canonical_budget_master_render
  - composition_build_report
  - composition_pre_spreadsheet_gate_result
  - relation_audit
  - specialist_questions
  - pts_post_budget_audit
  - pts_post_recurring_audit
  - omission_duplication_matrix
  - memory_conflict_matrix
  - learning_review_questions
  - learning_governance_dispatch
  - confidence
  - provenance
  - candidate_learning
  - decision_status
