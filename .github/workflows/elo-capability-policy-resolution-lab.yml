name: ELO Capability Policy Resolution Lab

on:
  pull_request:
    paths:
      - 'src/elo/agent_intake/capability_policy_resolution.py'
      - 'tests/agent_intake/test_capability_policy_resolution.py'
      - '.github/workflows/elo-capability-policy-resolution-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-policy-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Validate capability-policy resolution
        run: python -m pytest -q tests/agent_intake/test_capability_policy_resolution.py
