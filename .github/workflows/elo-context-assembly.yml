name: ELO Context Assembly

on:
  push:
    paths:
      - "src/elo/agentic/context_assembly.py"
      - "src/elo/agentic/supabase_memory_adapter.py"
      - "src/elo/agentic/contracts.py"
      - "tests/agentic/test_context_assembly.py"
      - "tests/agentic/test_context_assembly_integration.py"
      - "tests/governance/test_elo_canonical_reconciliation.py"
      - "automation/tasks/elo_canonical_reconciliation.py"
      - ".github/workflows/elo-context-assembly.yml"
  pull_request:
    paths:
      - "src/elo/agentic/context_assembly.py"
      - "src/elo/agentic/supabase_memory_adapter.py"
      - "src/elo/agentic/contracts.py"
      - "tests/agentic/test_context_assembly.py"
      - "tests/agentic/test_context_assembly_integration.py"
      - "tests/governance/test_elo_canonical_reconciliation.py"
      - "automation/tasks/elo_canonical_reconciliation.py"
      - ".github/workflows/elo-context-assembly.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: >-
          pytest
          tests/agentic/test_context_assembly.py
          tests/agentic/test_context_assembly_integration.py
          tests/agentic/test_supabase_memory_adapter.py
          tests/governance/test_elo_canonical_reconciliation.py
