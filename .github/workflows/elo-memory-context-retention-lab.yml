name: ELO Memory Context Retention Lab

on:
  pull_request:
    paths:
      - 'src/elo/agent_intake/memory_context_retention.py'
      - 'tests/agent_intake/test_memory_context_retention.py'
      - '.github/workflows/elo-memory-context-retention-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-context-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Validate retention experiment
        run: python -m pytest -q tests/agent_intake/test_memory_context_retention.py
