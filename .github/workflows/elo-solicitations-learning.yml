name: ELO Solicitations Learning

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
  push:
    paths:
      - 'memory/evolution/**'
      - '08-ai/ELO/ESPECIALISTAS/ORCAMENTO/APRENDIZADOS/**'
      - 'scripts/solicitations_learning_consolidate.py'
      - 'src/elo/core/analysis_solicitations_learning.py'
      - 'tests/core/test_analysis_solicitations_learning.py'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run core solicitation-learning tests
        run: python -m pytest tests/core/test_analysis_solicitations_learning.py

      - name: Consolidate genuinely new budget knowledge
        run: python scripts/solicitations_learning_consolidate.py

      - name: Commit newly generated canonical learning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 08-ai/ELO/ESPECIALISTAS/ORCAMENTO/APRENDIZADOS
          if git diff --cached --quiet; then
            echo "NO_NEW_KNOWLEDGE=true" >> "$GITHUB_ENV"
            echo "No new canonical knowledge or evidence enrichment." 
          else
            git commit -m "elo: persist new solicitation budget learning [skip elo-learning]"
            git push
            echo "NEW_KNOWLEDGE_PERSISTED=true" >> "$GITHUB_ENV"
          fi

      - name: Publish consolidation evidence
        uses: actions/upload-artifact@v4
        with:
          name: elo-solicitation-learning-candidates
          path: 08-ai/ELO/ESPECIALISTAS/ORCAMENTO/APRENDIZADOS
          if-no-files-found: ignore

      - name: Governance result
        run: |
          echo "ELO learning consolidation completed."
          echo "New knowledge is persisted only after tests and commit."
          echo "Existing canonical knowledge is reused and not duplicated."
          echo "Supabase remains the destination for structured calculation memory; this Git workflow does not invent or duplicate database records."
          echo "Laboratory is never executed by this workflow."
