name: ELO Solicitations Learning

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'
  push:
    paths:
      - 'memory/evolution/**'
      - 'scripts/solicitations_learning_consolidate.py'
      - 'src/elo/core/analysis_solicitations_learning.py'
      - 'tests/core/test_analysis_solicitations_learning.py'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run core solicitation-learning tests
        run: python -m pytest tests/core/test_analysis_solicitations_learning.py

      - name: Consolidate admitted solicitation learning
        run: python scripts/solicitations_learning_consolidate.py

      - name: Persist learning candidates
        run: |
          git config user.name 'ELO Solicitations Learning'
          git config user.email 'actions@users.noreply.github.com'
          git add memory/solicitations_learning
          if git diff --cached --quiet; then
            echo 'No new solicitation learning candidates.'
          else
            git commit -m 'chore(memory): consolidate solicitation learning candidates'
            git push
          fi
