name: ELO Solicitations Learning

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'
  push:
    paths:
      - 'memory/evolution/**'
      - 'scripts/solicitations_learning_consolidate.py'
      - 'src/elo/core/analysis_solicitations_learning.py'
      - 'tests/core/test_analysis_solicitations_learning.py'

permissions:
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run core solicitation-learning tests
        run: python -m pytest tests/core/test_analysis_solicitations_learning.py

      - name: Consolidate candidates without autonomous persistence
        run: python scripts/solicitations_learning_consolidate.py

      - name: Publish candidate report as workflow evidence only
        uses: actions/upload-artifact@v4
        with:
          name: elo-solicitation-learning-candidates
          path: memory/solicitations_learning
          if-no-files-found: ignore

      - name: Governance notice
        run: |
          echo 'ELO governance is authoritative for learning admission and persistence.'
          echo 'This workflow does not commit, push, promote, or merge learning autonomously.'
          echo 'Candidates are evidence for ELO analysis and approval.'
