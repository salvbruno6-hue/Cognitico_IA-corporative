name: ELO Solicitations Learning

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'
  push:
    paths:
      - 'memory/evolution/**'
      - '08-ai/ELO/ESPECIALISTAS/ORCAMENTO/APRENDIZADOS/**'
      - 'scripts/solicitations_learning_consolidate.py'
      - 'src/elo/core/analysis_solicitations_learning.py'
      - 'tests/core/test_analysis_solicitations_learning.py'

permissions:
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run core solicitation-learning tests
        run: python -m pytest tests/core/test_analysis_solicitations_learning.py

      - name: Consolidate candidates into canonical ELO budget-learning path
        run: python scripts/solicitations_learning_consolidate.py

      - name: Publish canonical budget-learning evidence
        uses: actions/upload-artifact@v4
        with:
          name: elo-solicitation-learning-candidates
          path: 08-ai/ELO/ESPECIALISTAS/ORCAMENTO/APRENDIZADOS
          if-no-files-found: ignore

      - name: Governance notice
        run: |
          echo 'ELO is the cognitive authority for learning admission and persistence.'
          echo 'All solicitation-budget learning is directed to 08-ai/ELO/ESPECIALISTAS/ORCAMENTO/APRENDIZADOS.'
          echo 'Supabase remains consultative memory for structured calculations and evidence.'
          echo 'No autonomous promotion or merge is performed by this workflow.'
