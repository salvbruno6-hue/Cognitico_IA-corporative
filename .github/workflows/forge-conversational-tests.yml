name: Forge Conversational Tests

on:
  pull_request:
    paths:
      - "src/**"
      - "elo-virtual-core/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches:
      - "feat/forge-conversational-runtime-v2"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: PYTHONPATH="$PWD/src:$PWD/elo-virtual-core" pytest -q tests elo-virtual-core/testes
