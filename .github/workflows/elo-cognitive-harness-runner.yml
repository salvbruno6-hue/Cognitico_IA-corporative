name: ELO Cognitive Harness Runner

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Nome da fixture (ex: so_001_26_trelica)"
        required: true
        type: string
        default: "so_001_26_trelica"
      all:
        description: "Rodar todas as fixtures?"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run-harness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Setup PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: List fixtures
        run: python scripts/run_cognitive_harness.py --list

      - name: Run single fixture
        if: ${{ !inputs.all }}
        env:
          FIXTURE: ${{ inputs.fixture }}
        run: |
          echo "===== Running fixture: $FIXTURE ====="
          python scripts/run_cognitive_harness.py "$FIXTURE"

      - name: Run all fixtures
        if: ${{ inputs.all }}
        run: |
          for f in $(python scripts/run_cognitive_harness.py --list | python -c "import sys, json; print(' '.join(json.load(sys.stdin)))"); do
            echo "===== Running fixture: $f ====="
            python scripts/run_cognitive_harness.py "$f"
            echo ""
          done
