name: ELO Checkpoint Precompress Lab

on:
  pull_request:
    paths:
      - 'src/elo/agent_intake/checkpoint_compaction_guard.py'
      - 'tests/agent_intake/test_checkpoint_compaction_guard.py'
      - '.github/workflows/elo-checkpoint-precompress-lab.yml'
  workflow_dispatch:

jobs:
  controlled-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m compileall -q src/elo/agent_intake/checkpoint_compaction_guard.py
      - run: python -m pytest -q tests/agent_intake/test_checkpoint_compaction_guard.py
