name: ELO State Recovery Integrity Lab

on:
  pull_request:
    paths:
      - 'src/elo/agent_intake/state_recovery_integrity.py'
      - 'tests/agent_intake/test_state_recovery_integrity.py'
      - '.github/workflows/elo-state-recovery-integrity-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-recovery-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Validate state recovery integrity
        run: python -m pytest -q tests/agent_intake/test_state_recovery_integrity.py
