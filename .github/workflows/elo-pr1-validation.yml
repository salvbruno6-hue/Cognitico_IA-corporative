name: ELO PR1 Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Compile source
        run: python -m compileall src
      - name: Run tests
        run: python -m pytest
