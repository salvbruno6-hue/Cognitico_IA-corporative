name: ELO Scan Orchestrator

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '15 5 * * 1'
  workflow_dispatch:
    inputs:
      force_weekly:
        description: Run weekly missions in addition to daily missions
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: elo-scan-orchestrator
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_PROJECT_REF: fxbpevjrkwhbicpmecow

jobs:
  governed-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical ELO code
        uses: actions/checkout@v4


      - name: Resolve scoped schema relationships
        id: relationships
        shell: bash
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule || 'manual' }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?SUPABASE_URL secret is required}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY secret is required}"
          export SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          api = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1"
          headers = {
              "apikey": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
              "Authorization": "Bearer " + os.environ["SUPABASE_SERVICE_ROLE_KEY"],
              "Accept": "application/json",
          }

          def get(table, params):
              url = f"{api}/{table}?{urlencode(params, doseq=True)}"
              req = Request(url, headers=headers)
              with urlopen(req, timeout=30) as response:
                  return json.load(response)

          # Scope is intentionally bounded to operational cascades already identified
          # by the ELO investigation: demand -> PCP -> production -> purchasing ->
          # supplier -> stock, plus shared model/item identity.
          scope = {
              "mt_balanco_demanda", "mt_linhas_plano_pcp", "mt_planos_pcp",
              "mt_ordens_producao", "mt_necessidades_materiais",
              "mt_ordens_compra_itens", "mt_ordens_compra",
              "compras_fornecedor", "compras_fornecedor_itens",
              "fornecedores", "fornecedor_cotacoes", "fornecedor_itens_cotacao",
              "mt_lotes_estoque", "mt_movimentacoes_estoque",
              "modelos", "lista_mae",
          }
          fks = get("elo_scan_fk_metadata", {
              "select": "constraint_name,source_schema,source_table,source_column,target_schema,target_table,target_column",
          })
          fks = [x for x in fks if x["source_table"] in scope and x["target_table"] in scope]

          columns = {}
          for fk in fks:
              columns.setdefault(fk["source_table"], {"id"})
              columns[fk["source_table"]].add(fk["source_column"])
              columns.setdefault(fk["target_table"], {"id"})
              columns[fk["target_table"]].add(fk["target_column"])

          rows_by_table = {}
          records = []
          for table in sorted(columns):
              # Bounded read: relationship investigation needs identity and FK values,
              # not business payloads.
              select = ",".join(sorted(columns[table]))
              rows = get(table, {"select": select, "limit": "100"})
              rows_by_table[table] = rows
              records.extend({"id": f"{table}:{r['id']}"} for r in rows if r.get("id") is not None)

          # Resolver consumes normalized FK metadata + scoped records; no graph is persisted.
          import sys
          sys.path.insert(0, str(Path.cwd() / "src"))
          from elo.agent_intake.supabase_relationship_resolver import resolve_fk_edges
          edges = resolve_fk_edges(fks, rows_by_table)
          payload = {
              "schema_source": "public.elo_scan_fk_metadata",
              "scope_tables": sorted(scope),
              "foreign_keys_considered": len(fks),
              "records_considered": len(records),
              "relationship_edges_resolved": len(edges),
              "records": records,
              "relationship_edges": list(edges),
              "governance": {
                  "structural_only": True,
                  "causality_established": False,
                  "learning_eligible": False,
                  "canonical_mutation": False,
                  "promotion": False,
              },
          }
          Path("scan-relationships.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print(json.dumps({k: payload[k] for k in ("foreign_keys_considered","records_considered","relationship_edges_resolved")}, indent=2))
          PY
          cat scan-relationships.json >> "$GITHUB_STEP_SUMMARY"

      - name: Investigation-first gate
        id: investigation
        shell: bash
        env:
          FORCE_WEEKLY: ${{ inputs.force_weekly || 'false' }}
          SCHEDULE_EXPR: ${{ github.event.schedule || 'manual' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path.cwd() / "src"))
          from elo.agent_intake.scan_investigation_gate import build_investigation_gate
          weekly = os.environ.get("FORCE_WEEKLY") == "true" or os.environ.get("SCHEDULE_EXPR") == "15 5 * * 1"
          missions = ["SCAN-001-source-inventory","SCAN-002-new-experiences","SCAN-003-errors-corrections","SCAN-004-arbitrated-decisions","SCAN-005-budget"]
          if weekly: missions += ["SCAN-006-repeated-patterns","SCAN-007-specializations","SCAN-008-evolution-gate","SCAN-009-unprocessed-sources"]
          relationship_payload = json.loads(Path("scan-relationships.json").read_text(encoding="utf-8"))
          result = build_investigation_gate({
              "objective": "Investigate registered ELO learning sources and their cross-domain relationships before deciding scan actions or learning candidates.",
              "scope": missions + ["registered learning sources","existing learning structures","budget learning structures"],
              "success_criteria": ["establish the evidence plan before source interpretation","investigate relevant cross-domain relationships before isolated conclusions","produce a bounded objective result without promoting learning"],
              "expected_output": "structured investigation report and bounded next action",
              "relevant_source_domains": ["planejamento_demanda","planejamento_pcp","producao_fluxo_modular","compras","orcamento"],
              "hypotheses": [{"id":"H1","statement":"registered sources contain evidence requiring cross-domain investigation","probability":0.7},{"id":"H2","statement":"current source state is insufficient for a learning conclusion","probability":0.3}],
              "prohibited_actions": ["canonical mutation","automatic learning promotion","causal inference from structural relationships alone"],
              "records": relationship_payload["records"],
              "relationship_edges": relationship_payload["relationship_edges"],
          })
          payload = {"status":result.status,"action":result.action,"objective":result.objective,"scope":result.scope,"success_criteria":result.success_criteria,"hypotheses":result.hypotheses,"relevant_source_domains":result.relevant_source_domains,"relation_plan":result.relation_plan,"evidence_requirements":result.evidence_requirements,"concept_outcome":result.concept_outcome,"evidence":result.evidence,"learning_candidate":result.learning_candidate}
          Path("scan-investigation.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print(json.dumps(payload, indent=2))
          if result.action == "BLOCKED":
              Path(os.environ["GITHUB_ENV"]).write_text("ELO_INVESTIGATION_ACTION=BLOCKED\n", encoding="utf-8")
              raise SystemExit("ELO scan blocked: investigation gate requirements not satisfied")
          Path(os.environ["GITHUB_ENV"]).write_text("ELO_INVESTIGATION_ACTION=INVESTIGATE\n", encoding="utf-8")
          PY
          cat scan-investigation.json >> "$GITHUB_STEP_SUMMARY"

      - name: Run governed scan
        shell: bash
        env:
          FORCE_WEEKLY: ${{ inputs.force_weekly || 'false' }}
          SCHEDULE_EXPR: ${{ github.event.schedule || 'manual' }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?SUPABASE_URL secret is required}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY secret is required}"

          api="${SUPABASE_URL%/}/rest/v1"
          auth=(-H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          get_json() {
            local table="$1"
            local query="$2"
            curl -fsS "${auth[@]}" "${api}/${table}?${query}" -H 'Accept: application/json'
          }

          count_rows() {
            local table="$1"
            curl -fsSI "${auth[@]}" "${api}/${table}?select=id&limit=1" -H 'Prefer: count=exact' \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="content-range" {print $2}' | awk -F'/' '{print $2}'
          }

          # Verify the canonical project before doing any work.
          project="$(curl -fsS "${auth[@]}" "${api}/elo_automation_registry?select=id,code,enabled,requires_validation&code=eq.elo_scan_orchestrator&limit=1")"
          automation_id="$(jq -r '.[0].id // empty' <<<"${project}")"
          [[ -n "${automation_id}" ]] || { echo 'elo_scan_orchestrator is not registered'; exit 1; }
          [[ "$(jq -r '.[0].enabled' <<<"${project}")" == 'true' ]] || { echo 'elo_scan_orchestrator is disabled'; exit 1; }

          run="$(curl -fsS -X POST "${auth[@]}" "${api}/elo_automation_runs" \
            -H 'Content-Type: application/json' -H 'Prefer: return=representation' \
            --data "$(jq -cn --arg aid "${automation_id}" '{automation_id:$aid, status:"RUNNING", details:{orchestrator:"ELO-SCAN-ORCHESTRATOR", project_ref:"fxbpevjrkwhbicpmecow", schedule:env.SCHEDULE_EXPR}}' )")"
          run_id="$(jq -r '.[0].id // empty' <<<"${run}")"
          [[ -n "${run_id}" ]] || { echo 'Could not create automation run'; exit 1; }

          daily=(
            SCAN-001-source-inventory
            SCAN-002-new-experiences
            SCAN-003-errors-corrections
            SCAN-004-arbitrated-decisions
            SCAN-005-budget
          )
          weekly=(
            SCAN-006-repeated-patterns
            SCAN-007-specializations
            SCAN-008-evolution-gate
            SCAN-009-unprocessed-sources
          )
          run_weekly=false
          if [[ "${FORCE_WEEKLY}" == 'true' || "${SCHEDULE_EXPR}" == '15 5 * * 1' ]]; then run_weekly=true; fi
          missions=("${daily[@]}")
          if [[ "${run_weekly}" == 'true' ]]; then missions+=("${weekly[@]}"); fi

          sources="$(get_json elo_aprendizado_fontes 'select=id,schema_name,table_name,dominio_codigo,extracao_ativa,enabled,extraction_mode,ultima_varredura&order=prioridade.asc,table_name.asc')"
          source_total="$(jq 'length' <<<"${sources}")"
          active_sources="$(jq '[.[] | select((.extracao_ativa // true) == true and (.enabled // true) == true)] | length' <<<"${sources}")"
          stale_sources="$(jq '[.[] | select(.ultima_varredura == null)] | length' <<<"${sources}")"

          extraction_total="$(count_rows elo_aprendizado_extracoes)"
          experience_total="$(count_rows elo_aprendizado_experiencias)"
          reasoning_total="$(count_rows elo_aprendizado_padroes_raciocinio)"
          specialization_total="$(count_rows elo_aprendizado_especializacoes)"
          evolution_total="$(count_rows elo_evolution_events)"
          budget_total="$(count_rows elo_orcamentos)"
          budget_memory_total="$(count_rows elo_orcamento_memoria)"
          budget_calc_total="$(count_rows elo_orcamento_calculos_aprendidos)"
          budget_evidence_total="$(count_rows elo_orcamento_calculo_evidencias)"
          budget_similarity_total="$(count_rows elo_orcamento_calculo_similaridades)"
          budget_assoc_total="$(count_rows elo_orcamento_associacoes)"
          budget_decision_total="$(count_rows elo_orcamento_decisoes)"

          observed="$(get_json elo_aprendizado_experiencias 'select=id,status_validacao,origem,origem_referencia,updated_at&status_validacao=eq.OBSERVADA&order=created_at.asc&limit=100')"
          observed_total="$(jq 'length' <<<"${observed}")"

          report="$(jq -n \
            --arg scan_id "${GITHUB_RUN_ID}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg schedule "${SCHEDULE_EXPR}" \
            --argjson weekly "${run_weekly}" \
            --argjson source_total "${source_total}" \
            --argjson active_sources "${active_sources}" \
            --argjson stale_sources "${stale_sources}" \
            --argjson extraction_total "${extraction_total:-0}" \
            --argjson experience_total "${experience_total:-0}" \
            --argjson observed_total "${observed_total:-0}" \
            --argjson reasoning_total "${reasoning_total:-0}" \
            --argjson specialization_total "${specialization_total:-0}" \
            --argjson evolution_total "${evolution_total:-0}" \
            --argjson budget_total "${budget_total:-0}" \
            --argjson budget_memory_total "${budget_memory_total:-0}" \
            --argjson budget_calc_total "${budget_calc_total:-0}" \
            --argjson budget_evidence_total "${budget_evidence_total:-0}" \
            --argjson budget_similarity_total "${budget_similarity_total:-0}" \
            --argjson budget_assoc_total "${budget_assoc_total:-0}" \
            --argjson budget_decision_total "${budget_decision_total:-0}" \
            --argjson missions "$(printf '%s\n' "${missions[@]}" | jq -R . | jq -s .)" \
            '{scan_id:$scan_id,execution_timestamp:$timestamp,project_ref:"fxbpevjrkwhbicpmecow",schedule:$schedule,weekly_missions:$weekly,missions_due:$missions,source_coverage:{registered:$source_total,active:$active_sources,never_scanned:$stale_sources},learning:{extractions:$extraction_total,experiences:$experience_total,observed_experiences:$observed_total,reasoning_patterns:$reasoning_total,specializations:$specialization_total,evolution_events:$evolution_total},budget:{budgets:$budget_total,memory:$budget_memory_total,calculations:$budget_calc_total,evidence:$budget_evidence_total,similarities:$budget_similarity_total,associations:$budget_assoc_total,decisions:$budget_decision_total},governance:{discovery_is_learning:false,canonical_mutation:false,automatic_learning_promotion:false,historical_records_immutable:true,provenance_required:true}}')"

          printf '%s\n' "${report}" | tee scan-report.json
          cat scan-report.json >> "$GITHUB_STEP_SUMMARY"

          # Route only evidence-supported conditions; never promote learning here.
          corrections=()
          [[ "${stale_sources}" -gt 0 ]] && corrections+=(stale_source)
          [[ "${observed_total}" -gt 0 ]] && corrections+=(extraction_gap)
          if ((${#corrections[@]} > 0)); then action='CORRECT'; else action='CONTINUE'; fi

          # Investigation is the first decision gate; source counters cannot bypass it.
          [[ "${ELO_INVESTIGATION_ACTION}" == "INVESTIGATE" ]] || action='BLOCKED'

          final_details="$(jq -n --argjson report "${report}" --arg action "${action}" --argjson corrections "$(printf '%s\n' "${corrections[@]:-}" | jq -R 'select(length>0)' | jq -s .)" '{orchestrator:"ELO-SCAN-ORCHESTRATOR",report:$report,next_action:$action,corrections:$corrections,learning_promotion:false,canonical_mutation:false}')"

          curl -fsS -X PATCH "${auth[@]}" "${api}/elo_automation_runs?id=eq.${run_id}" \
            -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            --data "$(jq -cn --arg details "${final_details}" --argjson processed "${source_total}" --arg status "SUCCEEDED" '{finished_at:(now|todateiso8601),status:$status,rows_affected:$processed,details:($details|fromjson)}')" >/dev/null

          echo "ELO_SCAN_ACTION=${action}"
          echo "ELO_SCAN_RUN_ID=${run_id}"
          echo "ELO_SCAN_MISSIONS=${#missions[@]}"
