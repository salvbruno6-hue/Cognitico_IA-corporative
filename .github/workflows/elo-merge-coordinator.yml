name: ELO Merge Coordinator

on:
  workflow_run:
    workflows:
      - ELO Agent Loop
      - ELO Evolution Gate
      - ELO Baseline Evidence Gate
      - ELO Maintenance Coordinator
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: elo-merge-coordinator-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  REPOSITORY: ${{ github.repository }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  merge:
    name: Governed PR merge
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve PR from completed workflow
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}")"
          run_name="$(jq -r '.name' <<<"$run_json")"

          if [[ "$run_name" == "ELO Agent Loop" ]]; then
            run_event="$(jq -r '.event' <<<"$run_json")"
            run_branch="$(jq -r '.head_branch // ""' <<<"$run_json")"
            run_path="$(jq -r '.path // ""' <<<"$run_json")"
            [[ "$run_path" == ".github/workflows/elo-agent-loop.yml" ]] || { echo "Unexpected Agent Loop workflow path."; exit 1; }
            if [[ "$run_event" == "workflow_dispatch" ]]; then
              [[ "$run_branch" == "main" ]] || { echo "Agent Loop dispatch must execute from trusted main."; exit 1; }
            elif [[ "$run_event" != "issues" && "$run_event" != "pull_request_target" ]]; then
              echo "Untrusted Agent Loop event: $run_event"
              exit 1
            fi

            artifact_name="elo-pr-ready-${WORKFLOW_RUN_ID}"
            artifacts="$(gh api "repos/${REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/artifacts")"
            artifact_count="$(jq --arg name "$artifact_name" '[.artifacts[]? | select(.name == $name and .expired == false)] | length' <<<"$artifacts")"
            [[ "$artifact_count" == "1" ]] || { echo "Exactly one non-expired PR-ready artifact is required."; exit 1; }
            rm -rf /tmp/elo-pr-ready
            mkdir -p /tmp/elo-pr-ready
            gh run download "$WORKFLOW_RUN_ID" --repo "$REPOSITORY" -n "$artifact_name" -D /tmp/elo-pr-ready
            evidence="/tmp/elo-pr-ready/pr-ready.json"
            test -f "$evidence"
            jq -e --arg repo "$REPOSITORY" --argjson run "$WORKFLOW_RUN_ID" '
              .schema == "elo.pr-ready.v2"
              and .producer == "ELO Agent Loop"
              and .repository == $repo
              and .run_id == $run
              and .decision == "PR_READY"
              and (.mode == "CREATE_FROM_ISSUE" or .mode == "ATTEST_EXISTING_PR")
              and (.pr_number | type == "number")
              and (.head_sha | test("^[0-9a-f]{40}$"))
              and .resource_id == ("pr:" + (.pr_number|tostring) + "@" + .head_sha)
            ' "$evidence" >/dev/null
            number="$(jq -r '.pr_number' "$evidence")"
            sha="$(jq -r '.head_sha' "$evidence")"
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          event_pr="$(jq -r '.pull_requests[0].number // empty' <<<"$run_json")"
          if [[ -n "$event_pr" ]]; then
            echo "number=$event_pr" >> "$GITHUB_OUTPUT"
            echo "sha=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prs="$(gh api --paginate "repos/${REPOSITORY}/commits/${EVENT_HEAD_SHA}/pulls" -H 'Accept: application/vnd.github+json')"
          number="$(jq -r '[.[] | select(.base.ref == "main" and .state == "open")][0].number // empty' <<<"$prs")"
          if [[ -z "$number" ]]; then
            echo "No open PR targeting main found for workflow head SHA ${EVENT_HEAD_SHA}."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "sha=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Inspect current PR state
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$REPOSITORY"             --json number,state,isDraft,baseRefName,headRefName,headRefOid,mergeable,mergeStateStatus,reviewDecision,reviews,comments,statusCheckRollup > /tmp/pr.json
          cat /tmp/pr.json

          jq -e '.state == "OPEN" and .isDraft == false and .baseRefName == "main"' /tmp/pr.json >/dev/null
          jq -e --arg sha "${{ steps.pr.outputs.sha }}" '.headRefOid == $sha' /tmp/pr.json >/dev/null

          if jq -e '[.reviews[]? | select(.state == "CHANGES_REQUESTED")] | length > 0' /tmp/pr.json >/dev/null; then
            echo "Blocking review detected."
            exit 1
          fi

          if jq -e '[.reviews[]? | select(.state == "PENDING")] | length > 0' /tmp/pr.json >/dev/null; then
            echo "Pending review detected."
            exit 1
          fi

          if [[ "$(jq -r '.reviewDecision // ""' /tmp/pr.json)" == "CHANGES_REQUESTED" ]]; then
            echo "reviewDecision=CHANGES_REQUESTED"
            exit 1
          fi

      - name: Verify PR-ready evidence
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          comments="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json comments)"
          run_ids="$(jq -r --arg sha "$HEAD_SHA" --arg pr "$PR_NUMBER" '
            .comments[]?
            | select(.author.login == "github-actions")
            | select(.body | contains("ELO_PR_READY_V2=1"))
            | select(.body | contains("ELO_AGENT_LOOP_PR_NUMBER=" + $pr))
            | select(.body | contains("ELO_HEAD_SHA=" + $sha))
            | select(.body | contains("ELO_RESOURCE_ID=pr:" + $pr + "@" + $sha))
            | (.body | capture("ELO_AGENT_LOOP_RUN_ID=(?<id>[0-9]+)")? | .id)
          ' <<<"$comments")"
          proved=false
          while IFS= read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}" || true)"
            [[ -n "$run_json" ]] || continue
            run_event="$(jq -r '.event // ""' <<<"$run_json")"
            run_branch="$(jq -r '.head_branch // ""' <<<"$run_json")"
            if jq -e --arg repo "$REPOSITORY" '
              .name == "ELO Agent Loop"
              and .path == ".github/workflows/elo-agent-loop.yml"
              and .status == "completed"
              and .conclusion == "success"
              and .repository.full_name == $repo
            ' <<<"$run_json" >/dev/null; then
              if [[ "$run_event" == "issues" || "$run_event" == "pull_request_target" || ( "$run_event" == "workflow_dispatch" && "$run_branch" == "main" ) ]]; then
                proved=true
                break
              fi
            fi
          done <<<"$run_ids"
          [[ "$proved" == "true" ]] || {
            echo "No genuine trusted Agent Loop PR-ready evidence for this PR and head SHA."
            exit 1
          }

      - name: Verify required GitHub checks
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          checks="$(gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" --required --json name,state,bucket)"
          echo "$checks"
          jq -e 'length > 0' <<<"$checks" >/dev/null
          jq -e 'all(.[]; .bucket == "pass")' <<<"$checks" >/dev/null

      - name: Verify applicable ELO gate evidence
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          comments="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json comments)"
          run_ids="$(jq -r --arg sha "$HEAD_SHA" --arg pr "$PR_NUMBER" '
            .comments[]?
            | select(.author.login == "github-actions")
            | select(.body | startswith("ELO Maintenance Coordinator: **APPROVED_FOR_MERGE**."))
            | select(.body | contains("ELO_MAINTENANCE_PR_NUMBER=" + $pr))
            | select(.body | contains("ELO_HEAD_SHA=" + $sha))
            | (.body | capture("ELO_MAINTENANCE_RUN_ID=(?<id>[0-9]+)")? | .id)
          ' <<<"$comments")"
          proved=false
          while IFS= read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            run_json="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}" || true)"
            if [[ -n "$run_json" ]] && jq -e --arg repo "$REPOSITORY" '
              .name == "ELO Maintenance Coordinator"
              and .status == "completed"
              and .conclusion == "success"
              and .repository.full_name == $repo
            ' <<<"$run_json" >/dev/null; then
              proved=true
              break
            fi
          done <<<"$run_ids"
          [[ "$proved" == "true" ]] || {
            echo "No authenticated Maintenance approval for this PR and head SHA."
            exit 1
          }

      - name: Verify elo-merge-authorized in Supabase
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?SUPABASE_URL secret is required}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY secret is required}"

          authz_url="${SUPABASE_URL%/}/rest/v1/elo_authorization_grants"
          headers=(-H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          repo_encoded="$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["REPOSITORY"], safe=""))')"

          required_resource="pr:${PR_NUMBER}@${HEAD_SHA}"
          grants="$(curl --fail-with-body --silent --show-error "${headers[@]}"             "${authz_url}?select=grant_id,binding_id,identity_id,session_id,authorization_state,operation,repository_full_name,issued_by_identity_id,issued_at,expires_at,revoked_at,metadata&authorization_state=eq.elo-merge-authorized&operation=eq.merge&repository_full_name=eq.${repo_encoded}&revoked_at=is.null&limit=20")"

          valid_grant=""
          while IFS= read -r row; do
            issued="$(jq -r '.issued_at' <<<"$row")"
            expires="$(jq -r '.expires_at' <<<"$row")"
            issued_epoch="$(date -u -d "$issued" +%s 2>/dev/null || true)"
            expires_epoch="$(date -u -d "$expires" +%s 2>/dev/null || true)"
            now_epoch="$(date -u +%s)"
            if [[ -n "$issued_epoch" && -n "$expires_epoch" ]] &&                (( issued_epoch <= now_epoch && now_epoch < expires_epoch )); then
              if [[ "$(jq -r '.metadata.issuer_role // ""' <<<"$row")" == "CANONICAL_ADMIN" ]]; then
                valid_grant="$row"
                break
              fi
            fi
          done < <(jq -c --arg resource "$required_resource" '.[] | select(.revoked_at == null and .operation == "merge" and .metadata.issuer_role == "CANONICAL_ADMIN" and .metadata.resource_id == $resource and .session_id != null)' <<<"$grants")

          if [[ -z "$valid_grant" ]]; then
            echo "No valid elo-merge-authorized grant found."
            exit 1
          fi
          printf '%s\n' "$valid_grant" > /tmp/grant.json
          jq '{grant_id, binding_id, authorization_state, operation, repository_full_name, issued_by_identity_id, expires_at}' /tmp/grant.json

          issuer="$(jq -r '.issued_by_identity_id' /tmp/grant.json)"
          binding_id="$(jq -r '.binding_id' /tmp/grant.json)"
          binding_url="${SUPABASE_URL%/}/rest/v1/elo_operator_github_bindings"
          binding="$(curl --fail-with-body --silent --show-error "${headers[@]}"             "${binding_url}?select=binding_id,identity_id,github_user_id,github_login,repository_full_name,active&binding_id=eq.${binding_id}&repository_full_name=eq.${repo_encoded}&active=eq.true&limit=1")"
          target_identity="$(jq -r '.identity_id' /tmp/grant.json)"
          jq -e --arg identity "$target_identity" 'length == 1 and .[0].identity_id == $identity and .[0].active == true' <<<"$binding" >/dev/null

          session_id="$(jq -r '.session_id' /tmp/grant.json)"
          session_url="${SUPABASE_URL%/}/rest/v1/elo_identity_sessions"
          session="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${session_url}?select=session_id,identity_id,issued_at,expires_at,revoked_at&session_id=eq.${session_id}&identity_id=eq.${target_identity}&revoked_at=is.null&limit=1")"
          jq -e 'length == 1' <<<"$session" >/dev/null
          session_issued="$(jq -r '.[0].issued_at' <<<"$session")"
          session_expires="$(jq -r '.[0].expires_at' <<<"$session")"
          session_issued_epoch="$(date -u -d "$session_issued" +%s 2>/dev/null || true)"
          session_expires_epoch="$(date -u -d "$session_expires" +%s 2>/dev/null || true)"
          session_now_epoch="$(date -u +%s)"
          [[ -n "$session_issued_epoch" && -n "$session_expires_epoch" ]] && (( session_issued_epoch <= session_now_epoch && session_now_epoch < session_expires_epoch ))

          role_url="${SUPABASE_URL%/}/rest/v1/elo_identity_roles"
          roles="$(curl --fail-with-body --silent --show-error "${headers[@]}"             "${role_url}?select=identity_id,elo_roles!inner(code,active)&identity_id=eq.${issuer}&elo_roles.code=eq.CANONICAL_ADMIN&elo_roles.active=eq.true")"
          jq -e 'length > 0' <<<"$roles" >/dev/null

      - name: Execute governed squash merge
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state,mergeable,mergeStateStatus,headRefOid,baseRefName)"
          jq -e --arg sha "$HEAD_SHA" '.state == "OPEN" and .headRefOid == $sha and .mergeable == "MERGEABLE" and (.mergeStateStatus == "CLEAN" or .mergeStateStatus == "HAS_HOOKS") and .baseRefName == "main"' <<<"$pr_json" >/dev/null
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch=false

      - name: Verify merge result
        if: steps.pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          result="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state,merged,mergedAt,baseRefName,mergeCommit,headRefOid)"
          echo "$result" | jq '{state,merged,mergedAt,baseRefName,mergeCommit,headRefOid}'
          jq -e '.state == "MERGED" and .merged == true and .baseRefName == "main"' <<<"$result" >/dev/null
