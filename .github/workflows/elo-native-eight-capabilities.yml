name: ELO Native Eight Capabilities

on:
  pull_request:
    paths:
      - 'src/elo/agent_intake/native_capabilities.py'
      - 'tests/agent_intake/test_native_capabilities.py'
      - '.github/workflows/elo-native-eight-capabilities.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-eight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Execute eight native capabilities
        run: python -m pytest -q tests/agent_intake/test_native_capabilities.py
