name: ELO Hermes Knowledge Loop

on:
  push:
    branches:
      - 'codex/hermes-knowledge-loop'
    paths:
      - 'src/elo/agent_intake/hermes_knowledge_loop.py'
      - 'tests/agent_intake/test_hermes_knowledge_loop.py'
      - '06-knowledge-engineering/hermes/MEMORY.md'
      - '.github/workflows/elo-hermes-knowledge-loop.yml'
  pull_request:
    paths:
      - 'src/elo/agent_intake/hermes_knowledge_loop.py'
      - 'tests/agent_intake/test_hermes_knowledge_loop.py'
      - '06-knowledge-engineering/hermes/MEMORY.md'
      - '.github/workflows/elo-hermes-knowledge-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes-knowledge-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Run governed intake tests
        run: python -m pytest tests/agent_intake/test_hermes_knowledge_loop.py
