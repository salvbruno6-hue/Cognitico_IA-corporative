name: ELO Resource Address Registry

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: elo-resource-address-registry
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inventory repository tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/git/trees/{os.environ['GITHUB_SHA']}?recursive=1"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          })
          data = json.load(urllib.request.urlopen(req))
          files = sorted(item["path"] for item in data.get("tree", []) if item.get("type") == "blob")
          if data.get("truncated"):
              raise SystemExit("Git tree response was truncated; refusing incomplete registry.")
          os.makedirs(".elo-inventory", exist_ok=True)
          with open(".elo-inventory/repository-tree.json", "w", encoding="utf-8") as fh:
              json.dump({"files": files}, fh, ensure_ascii=False, indent=2)
          PY

      - name: Inventory Supabase schema through approved REST view
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          params = urllib.parse.urlencode({
              "select": "table_name,table_type",
              "order": "table_name.asc",
          })
          req = urllib.request.Request(
              f"{base}/rest/v1/elo_scan_schema_inventory?{params}",
              headers={
                  "apikey": key,
                  "Authorization": f"Bearer {key}",
                  "Accept": "application/json",
              },
          )
          data = json.load(urllib.request.urlopen(req))
          tables = sorted(row["table_name"] for row in data if row.get("table_type") == "BASE TABLE")
          views = sorted(row["table_name"] for row in data if row.get("table_type") == "VIEW")
          os.makedirs(".elo-inventory", exist_ok=True)
          with open(".elo-inventory/database-schema.json", "w", encoding="utf-8") as fh:
              json.dump({"tables": tables, "views": views}, fh, ensure_ascii=False, indent=2)
          PY

      - name: Build registry
        run: python scripts/build_elo_resource_registry.py

      - name: Validate registry
        run: |
          python -m pytest tests/core/test_resource_registry_builder.py tests/core/test_artifact_resolver.py tests/core/test_resource_locator.py

      - name: Publish generated registry through governed PR
        run: |
          git config user.name "ELO Registry Bot"
          git config user.email "elo-registry-bot@users.noreply.github.com"
          git add config/elo_resource_registry.json
          if git diff --cached --quiet; then
            echo "Registry unchanged."
            exit 0
          fi
          git commit -m "chore(elo): refresh resource address registry"
          refresh_branch="elo/resource-registry-refresh"
          # This is a bot-owned refresh branch. Rebase it to the current generated result
          # so scheduled runs remain idempotent instead of accumulating stale commits.
          git fetch origin "$refresh_branch" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$refresh_branch"; then
            git push --force-with-lease origin HEAD:"$refresh_branch"
          else
            git push origin HEAD:"$refresh_branch"
          fi
          gh pr create --base main --head "$refresh_branch" --title "chore(elo): refresh resource address registry" --body "Automated refresh of the governed ELO Resource Address Registry from current GitHub and Supabase inventories." || true
