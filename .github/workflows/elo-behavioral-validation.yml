name: ELO Behavioral Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Compile source
        run: python -m compileall src
      - name: Run tests
        shell: bash
        run: |
          set +e
          python -m pytest -ra --tb=short > pytest.log 2>&1
          status=$?
          echo "$status" > pytest.exit
          cat pytest.log
          exit "$status"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elo-test-evidence
          path: |
            pytest.log
            pytest.exit
          if-no-files-found: error
