name: ELO Agent Loop

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue containing the ELO task specification
        required: true
        type: string

concurrency:
  group: elo-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  REPO: ${{ github.repository }}
  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
  MAX_CYCLES: 3

jobs:
  execute-review-correct-pr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.label.name == 'codex-ready' ||
        (github.event.action == 'opened' && contains(join(github.event.issue.labels.*.name, ','), 'codex-ready'))))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Resolve task context
        id: task
        shell: bash
        run: |
          set -euo pipefail
          gh issue view "${ISSUE_NUMBER}" --repo "${REPO}" --json number,title,body,labels > issue.json
          task_file=$(python - <<'PY'
          import json, pathlib
          issue=json.load(open('issue.json'))
          body=issue.get('body') or ''
          candidates=[]
          for line in body.splitlines():
              if 'automation/tasks/' in line and line.strip().endswith(('.yml','.yaml')):
                  candidates.append(line.strip().strip('`'))
          print(candidates[0] if candidates else 'automation/tasks/ELO-AUTO-001.yml')
          PY
          )
          task_id=$(basename "${task_file}" | sed -E 's/\.(yml|yaml)$//' | tr '[:lower:]' '[:upper:]')
          echo "task_file=${task_file}" >> "$GITHUB_OUTPUT"
          echo "task_id=${task_id}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${task_id} from ${task_file}"

      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Load governance context
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f automation/ELO_CHAT_CODEX_BRIDGE.md
          test -f "${{ steps.task.outputs.task_file }}"
          cat AGENTS.md
          cat automation/ELO_CHAT_CODEX_BRIDGE.md
          cat "${{ steps.task.outputs.task_file }}"

      - name: Codex implementation pass
        uses: openai/codex-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          prompt: |
            Work only on the GitHub issue provided by the workflow. Inventory canonical owners, capabilities, routers, memories, workflows and governance gates before editing. Reuse -> strengthen -> refactor -> deprecate -> create. Do not create a second Core, memory, Orchestrator, router, workflow or authority. Supabase is consultative only in this implementation pass. Do not persist or promote learning autonomously. Do not commit, push, create a PR, merge, or write to main. Make only the minimal code/config changes required by the issue.

      - name: Create governed working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ELO Agent Loop"
          git config user.email "elo-agent-loop@users.noreply.github.com"
          branch="codex/${{ steps.task.outputs.task_id }}-${GITHUB_RUN_ID}"
          git checkout -b "${branch}"
          echo "BRANCH=${branch}" >> "$GITHUB_ENV"

      - name: ELO governance gate
        id: elo_gate
        uses: openai/codex-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          prompt: |
            Review the current working tree against AGENTS.md, the task contract, canonical architecture and the issue acceptance criteria. Verify reuse/no-duplication, scope, tests, security, governance and main-write protection. Write a concise decision to elo-governance.txt and make its FINAL line exactly one of: ELO_DECISION=APPROVE_COMMIT, ELO_DECISION=CORRECT, ELO_DECISION=BLOCK. Do not commit or push.

      - name: Enforce ELO gate
        shell: bash
        run: |
          set -euo pipefail
          decision=$(tail -n 1 elo-governance.txt 2>/dev/null || true)
          case "${decision}" in
            ELO_DECISION=APPROVE_COMMIT) ;;
            ELO_DECISION=CORRECT) exit 20 ;;
            ELO_DECISION=BLOCK) exit 21 ;;
            *) echo "Invalid ELO decision: ${decision}"; exit 22 ;;
          esac

      - name: Correction cycle
        if: failure()
        uses: openai/codex-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          prompt: |
            Correct the blocking findings from elo-governance.txt with the smallest safe change. Re-run relevant tests. Do not commit, push, create a PR, merge, or write to main.

      - name: Final ELO governance gate
        if: failure()
        id: final_elo_gate
        uses: openai/codex-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          prompt: |
            Re-review the corrected working tree. Replace elo-governance.txt with the final decision and make its FINAL line exactly ELO_DECISION=APPROVE_COMMIT or ELO_DECISION=BLOCK. Do not commit or push.

      - name: Enforce final ELO gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          decision=$(tail -n 1 elo-governance.txt 2>/dev/null || true)
          if [ "${decision}" != "ELO_DECISION=APPROVE_COMMIT" ]; then
            echo "Final ELO gate did not approve commit: ${decision}"
            exit 1
          fi

      - name: Virtual Laboratory gate for budget learning scope
        if: contains(github.event.issue.title, 'orçamento') || contains(github.event.issue.title, 'budget')
        uses: openai/codex-action@v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          prompt: |
            Validate budget-learning changes in the virtual laboratory. Confirm reproducibility, generalization boundaries and no unauthorized Core promotion. Write lab-governance.txt with final line exactly LAB_DECISION=PASS or LAB_DECISION=BLOCK. Do not commit or push.

      - name: Enforce laboratory gate
        if: contains(github.event.issue.title, 'orçamento') || contains(github.event.issue.title, 'budget')
        shell: bash
        run: |
          set -euo pipefail
          decision=$(tail -n 1 lab-governance.txt 2>/dev/null || true)
          test "${decision}" = "LAB_DECISION=PASS"

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            python -m compileall src tests 2>/dev/null || true
          fi
          if [ -d tests ]; then
            python -m pytest -q
          fi

      - name: Commit governed change
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo "No repository change; no commit/PR created."
            exit 0
          fi
          git add -A
          git commit -m "fix(elo): execute governed agent loop for issue ${ISSUE_NUMBER}"

      - name: Push governed branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD >/dev/null 2>&1 && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push --set-upstream origin "${BRANCH}"
          fi

      - name: Create pull request when change exists
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet origin/main...HEAD; then
            echo "No change to publish."
            exit 0
          fi
          gh pr create --repo "${REPO}" --base main --head "${BRANCH}" --title "fix(elo): governed execution for issue #${ISSUE_NUMBER}" --body "Closes #${ISSUE_NUMBER}. Generated only after ELO governance gates passed. Main remains protected; merge is a separate governed action."

      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/evidence
          {
            echo "# ELO Agent Loop Evidence"
            echo
            echo "- issue: #${ISSUE_NUMBER}"
            echo "- task: ${{ steps.task.outputs.task_id }}"
            echo "- run: ${GITHUB_RUN_ID}"
            echo "- branch: ${BRANCH:-none}"
            echo "- main_write: prohibited"
            echo "- merge: not performed"
            echo "- final_elo_gate: $(tail -n 1 elo-governance.txt 2>/dev/null || echo unavailable)"
          } > automation/evidence/elo-agent-loop-${GITHUB_RUN_ID}.md

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elo-agent-loop-evidence-${{ github.run_id }}
          path: |
            elo-governance.txt
            lab-governance.txt
            automation/evidence/elo-agent-loop-${{ github.run_id }}.md
