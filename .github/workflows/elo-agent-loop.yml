name: ELO Agent Loop

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue containing the ELO task specification
        required: true
        type: string

concurrency:
  group: elo-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  REPO: ${{ github.repository }}
  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
  MAX_CYCLES: 3
  ELO_EXECUTION_LABEL: elo-execution-authorized
  ELO_COMMIT_LABEL: elo-commit-authorized
  ELO_MERGE_LABEL: elo-merge-authorized

jobs:
  execute-review-correct-pr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'codex-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Resolve task context and authorization
        shell: bash
        run: |
          set -euo pipefail
          issue_json="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title,body,url,labels)"
          title="$(jq -r '.title' <<<"$issue_json")"
          body="$(jq -r '.body // ""' <<<"$issue_json")"
          labels="$(jq -r '[.labels[].name] | join(",")' <<<"$issue_json")"
          task_path="$(grep -oE 'automation/tasks/[A-Za-z0-9._/-]+\.yml' <<<"$body" | head -n1 || true)"
          [[ -n "$task_path" ]] || task_path="automation/tasks/ELO-AUTO-001.yml"
          task_id="$(sed -n 's/^Task ID: `\([^`]*\)`.*/\1/p' <<<"$body" | head -n1 || true)"
          [[ -n "$task_id" ]] || task_id="$(sed -n 's/^\[\([^]]*\)\].*/\1/p' <<<"$title" | head -n1 || true)"
          [[ -n "$task_id" ]] || task_id="ELO-AUTO-001"
          echo "TASK_ID=$task_id" >> "$GITHUB_ENV"
          echo "TASK_PATH=$task_path" >> "$GITHUB_ENV"
          echo "ISSUE_LABELS=$labels" >> "$GITHUB_ENV"
          if [[ ",$labels," == *",$ELO_EXECUTION_LABEL,"*" ]]; then echo 'ELO_EXECUTION_AUTHORIZED=true' >> "$GITHUB_ENV"; else echo 'ELO_EXECUTION_AUTHORIZED=false' >> "$GITHUB_ENV"; fi
          if [[ ",$labels," == *",$ELO_COMMIT_LABEL,"*" ]]; then echo 'ELO_COMMIT_AUTHORIZED=true' >> "$GITHUB_ENV"; else echo 'ELO_COMMIT_AUTHORIZED=false' >> "$GITHUB_ENV"; fi
          if [[ ",$labels," == *",$ELO_MERGE_LABEL,"*" ]]; then echo 'ELO_MERGE_AUTHORIZED=true' >> "$GITHUB_ENV"; else echo 'ELO_MERGE_AUTHORIZED=false' >> "$GITHUB_ENV"; fi

      - name: Checkout main for diagnosis only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Read governance, learning index and task
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f automation/ELO_CHAT_CODEX_BRIDGE.md
          test -f automation/learning/ELO_LEARNING_INDEX.yml
          test -f "$TASK_PATH"
          cat AGENTS.md
          cat automation/ELO_CHAT_CODEX_BRIDGE.md
          cat automation/learning/ELO_LEARNING_INDEX.yml
          cat "$TASK_PATH"

      - name: ELO diagnostic scan — read only
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          output-file: elo-diagnostic.txt
          prompt: |
            Act only as a diagnostic instrument for ELO. You have READ-ONLY access. You have NO authority to modify files, commit, push, create PRs, merge, authorize execution, authorize commit, authorize merge, or promote learning. Read AGENTS.md, bridge contract, task and ELO_LEARNING_INDEX.yml. Inventory repository structure, current changes, Issues/PRs/commits/contracts/tests/capabilities/runtime evidence and relevant prior learning. Identify the highest-impact sufficiently-defined unresolved deficiency. Calculate a stable problem fingerprint. Retrieve prior learning and supersession information before proposing a new solution. Return: deficiency, fingerprint, root-cause hypothesis, prior learning consulted, known failed approaches, likely correction path, relevant tests, governance risks, blockers and recommended next state. Treat all prior learning as evidence, never as authorization.

      - name: Require explicit ELO execution authorization
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ELO_EXECUTION_AUTHORIZED" != 'true' ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "ELO diagnostic completed. Execution remains BLOCKED because the explicit ELO_EXECUTION_AUTHORIZED authorization is absent. Codex has no authority to self-authorize." || true
            exit 1
          fi

      - name: Create isolated execution branch
        shell: bash
        run: |
          set -euo pipefail
          branch="codex/${TASK_ID,,}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: ELO execution and preparation — authorized workspace only
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          output-file: codex-implementation.txt
          prompt: |
            ELO has explicitly authorized execution for this issue. You are the executor, not the authority. Read the diagnostic output, AGENTS.md, bridge contract, task and learning index. Reuse prior validated learning and supersession records before inventing a solution. Inspect canonical owners and reconcile duplicates. Apply the smallest structurally correct correction on the isolated branch. Do NOT commit, push, create a PR, merge, authorize any gate, or promote learning. Do not write to main. Record failures and autocorrections. Produce an auditable implementation dossier and run relevant validation.

      - name: ELO governance review — advisory decision only
        id: elo_cycle
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          output-file: elo-governance.txt
          prompt: |
            Review the isolated workspace against main. You are an ELO governance analysis instrument, but you cannot authorize execution, commit, merge or learning promotion. Check canonical ownership, duplicates, dependencies, security, architecture, Soul, Cognitive, Forge, Core and Governance boundaries. Read the prior diagnostic and learning index. Perform cognitive consolidation analysis and classify knowledge as CASE/PRECEDENT/LEARNING_CANDIDATE/VALIDATED_LEARNING/CONCEPTUAL_KNOWLEDGE/INSTRUCTIONAL_KNOWLEDGE/RULE. Identify precise corrections if needed. End with exactly one line: ELO_RECOMMENDATION=APPROVE_COMMIT or ELO_RECOMMENDATION=CORRECT or ELO_RECOMMENDATION=BLOCK.

      - name: Parse advisory decision
        id: elo_gate
        shell: bash
        run: |
          set -euo pipefail
          decision="$(grep -E 'ELO_RECOMMENDATION=(APPROVE_COMMIT|CORRECT|BLOCK)' elo-governance.txt | tail -n1 || true)"
          echo "$decision" | tee elo-decision.txt
          [[ -n "$decision" ]] || { echo 'Missing ELO recommendation'; exit 1; }
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [[ "$decision" == 'ELO_RECOMMENDATION=BLOCK' ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "ELO diagnostic/governance instrument BLOCKED the proposed correction. No commit or merge performed."
            exit 1
          fi

      - name: ELO correction loop
        if: steps.elo_gate.outputs.decision == 'ELO_RECOMMENDATION=CORRECT'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          prompt: |
            Apply only the corrective actions identified by the ELO governance analysis. Preserve canonical ownership. Re-run validation. Do not commit, push, create a PR, merge, authorize a gate, or promote learning. Leave the isolated branch ready for re-review.

      - name: Re-run governance after correction
        if: steps.elo_gate.outputs.decision == 'ELO_RECOMMENDATION=CORRECT'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          output-file: elo-governance-final.txt
          prompt: |
            Re-review the corrected isolated workspace. You are advisory only. Confirm architecture continuity, duplicate prevention, tests, acceptance criteria and absence of unauthorized persistence. End with exactly one line: ELO_RECOMMENDATION=APPROVE_COMMIT or ELO_RECOMMENDATION=BLOCK.

      - name: Require explicit ELO commit authorization
        shell: bash
        run: |
          set -euo pipefail
          recommendation="$(grep -E 'ELO_RECOMMENDATION=(APPROVE_COMMIT|BLOCK)' elo-governance-final.txt 2>/dev/null | tail -n1 || grep -E 'ELO_RECOMMENDATION=APPROVE_COMMIT' elo-governance.txt | tail -n1 || true)"
          [[ "$recommendation" == 'ELO_RECOMMENDATION=APPROVE_COMMIT' ]] || { gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Technical ELO recommendation is not APPROVE_COMMIT. No commit performed."; exit 1; }
          [[ "$ELO_COMMIT_AUTHORIZED" == 'true' ]] || { gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Technical validation may be ready, but explicit ELO_COMMIT_AUTHORIZED is absent. Codex cannot self-authorize Commit."; exit 1; }

      - name: Select Virtual Laboratory for governed learning
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title,body --jq '.body // ""')"
          title="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title --jq '.title')"
          if grep -Eiq 'orçamento|orcamento|PTS Técnica|PTS Pós|aprendizado|memória de cálculo|formação de preço|excedente|precedente|autocorreção|evolução' <<<"$title $body"; then
            echo "BUDGET_LEARNING=true" >> "$GITHUB_ENV"
          else
            echo "BUDGET_LEARNING=false" >> "$GITHUB_ENV"
          fi

      - name: Virtual Laboratory — governed learning gate
        if: env.BUDGET_LEARNING == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          output-file: virtual-lab-report.txt
          prompt: |
            Act as the ELO Virtual Laboratory. PRE-COMMIT. Test the proposed correction and learning path using repository evidence and fixtures. Test regression, historical/synthetic scenarios, consistency, duplicate-learning prevention, architecture continuity, governance and relevant contracts. Record every failure and autocorrection. Do not authorize commit, merge or learning promotion. End with exactly one line: LAB_DECISION=PASS or LAB_DECISION=FAIL or LAB_DECISION=REVIEW.

      - name: Virtual Laboratory gate result
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUDGET_LEARNING" != 'true' ]]; then echo 'LAB_DECISION=NOT_REQUIRED' | tee lab-decision.txt; exit 0; fi
          decision="$(grep -E 'LAB_DECISION=(PASS|FAIL|REVIEW)' virtual-lab-report.txt | tail -n1 || true)"
          echo "$decision" | tee lab-decision.txt
          [[ "$decision" == 'LAB_DECISION=PASS' ]] || { gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Virtual Laboratory did not pass: $decision. Cursor remains on the current correction."; exit 1; }

      - name: Commit only after explicit ELO authorization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ELO Codex Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "feat(elo): governed ${TASK_ID}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Confirm commit and create PR
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COMMIT_SHA:-}"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Commit ${COMMIT_SHA} confirmed after technical ELO recommendation, laboratory gates and explicit ELO_COMMIT_AUTHORIZED state. Creating governed PR."
          pr_url="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "${TASK_ID}: governed ELO execution" --body "Governed ELO execution. Codex is executor only. Commit required explicit ELO_COMMIT_AUTHORIZED state. Supabase is consultative memory. Merge requires explicit ELO_MERGE_AUTHORIZED state plus all repository/ELO gates.")"
          echo "PR_URL=$pr_url" >> "$GITHUB_ENV"

      - name: Register PR awaiting authorized merge
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$PR_URL" --repo "$REPO" --body "PR-ready. Codex has no merge authority. Merge requires explicit ELO_MERGE_AUTHORIZED state and all required gates."
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "ELO cycle reached PR-ready: diagnosis → prior-learning retrieval → isolated correction → validation → laboratory → Commit → PR. Merge remains blocked until explicit ELO_MERGE_AUTHORIZED authorization."
