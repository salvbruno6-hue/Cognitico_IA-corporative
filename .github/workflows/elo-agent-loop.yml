name: ELO Agent Loop

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue containing the ELO task specification
        required: false
        type: string
      pr_number:
        description: Existing pull request to attest without modifying its implementation
        required: false
        type: string
      expected_head_sha:
        description: Optional immutable head SHA expected for existing-PR attestation
        required: false
        type: string

concurrency:
  group: elo-agent-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}
  ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
  MAX_CYCLES: 3

jobs:
  execute-review-correct-pr:
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr_number == '') ||
      (github.event_name == 'issues' &&
       (github.event.label.name == 'codex-ready' ||
        (github.event.action == 'opened' && contains(join(github.event.issue.labels.*.name, ','), 'codex-ready'))))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Resolve task context
        shell: bash
        run: |
          set -euo pipefail
          issue_json="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title,body,url,labels)"
          title="$(jq -r '.title' <<<"$issue_json")"
          body="$(jq -r '.body // ""' <<<"$issue_json")"
          task_path="$(grep -oE 'automation/tasks/[A-Za-z0-9._/-]+\.yml' <<<"$body" | head -n1 || true)"
          [[ -n "$task_path" ]] || task_path="automation/tasks/ELO-AUTO-001.yml"
          task_id="$(sed -n 's/^Task ID: `\([^`]*\)`.*/\1/p' <<<"$body" | head -n1 || true)"
          [[ -n "$task_id" ]] || task_id="$(sed -n 's/^\[\([^]]*\)\].*/\1/p' <<<"$title" | head -n1 || true)"
          [[ -n "$task_id" ]] || task_id="ELO-AUTO-001"
          echo "TASK_ID=$task_id" >> "$GITHUB_ENV"
          echo "TASK_PATH=$task_path" >> "$GITHUB_ENV"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read governance and task
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f automation/ELO_CHAT_CODEX_BRIDGE.md
          test -f "$TASK_PATH"
          cat AGENTS.md
          cat automation/ELO_CHAT_CODEX_BRIDGE.md
          cat "$TASK_PATH"

      - name: Verify canonical ELO execution authorization
        id: execution_authz
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "Missing Supabase read credential; canonical execution authorization is required."; exit 1; }
          binding="$(curl -fsS "$SUPABASE_URL/rest/v1/elo_operator_github_bindings?github_user_id=eq.${GITHUB_ACTOR_ID}&repository_full_name=eq.${REPO}&active=eq.true&select=binding_id" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")"
          binding_id="$(jq -r '.[0].binding_id // empty' <<<"$binding")"
          test -n "$binding_id" || { echo "elo-execution-authorized binding not found."; exit 1; }
          grants="$(curl -fsS "$SUPABASE_URL/rest/v1/elo_authorization_grants?binding_id=eq.${binding_id}&authorization_state=eq.elo-execution-authorized&operation=eq.execute&repository_full_name=eq.${REPO}&revoked_at=is.null&expires_at=gt.$(date -u +%Y-%m-%dT%H:%M:%SZ)&select=grant_id,expires_at&order=issued_at.desc&limit=1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")"
          jq -e 'length > 0' <<<"$grants" >/dev/null || { echo "elo-execution-authorized grant not found or expired."; exit 1; }
          echo "$grants" > execution-authorization.json
      - name: ELO execution and preparation
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          output-file: codex-implementation.txt
          prompt: |
            Act as the ELO execution agent. Read AGENTS.md, bridge contract and task. Inspect repository and reuse canonical architecture. Before proposing or implementing anything, inventory existing capabilities, canonical owners, routers, memories, workflows, gates and sources of truth relevant to the task. Apply REUSE → STRENGTHEN → REFACTOR → DEPRECATE → CREATE only when absence is proven. A duplicate or parallel authority, unresolved source of truth, or competing decision responsibility is a blocker. Do not create a second Cognitive Core, memory authority, Orchestrator, router, workflow, authentication path or governance gate. Prepare the requested change in workspace only. Do NOT commit, push, create a PR, merge, or write to main. For learning tasks, ELO is the cognitive authority; consult Supabase as memory only and return evidence to ELO. Never autonomously persist or promote learning. Produce an auditable dossier and run relevant validation.

      - name: Create local execution branch
        shell: bash
        run: |
          set -euo pipefail
          branch="codex/${TASK_ID,,}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: ELO governance cycle
        id: elo_cycle
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          output-file: elo-governance.txt
          prompt: |
            You are ELO governance authority. Review the current workspace diff against main. Perform canonical responsibility reconciliation before approving the change: resolve canonical identity and source of truth; inspect existing equivalent capabilities; identify producers, consumers, aliases, parallel implementations, overlapping workflows and competing decision authorities; verify router, memory, learning, workflow and gate ownership; and confirm no duplicate or parallel authority is introduced. Apply REUSE → STRENGTHEN → REFACTOR → DEPRECATE → CREATE only when absence is proven. A duplicate/parallel capability, unresolved source of truth, competing decision responsibility or contract conflict is a hard BLOCK. Consult Supabase memory as evidence only. Perform cognitive MERGE, consolidate equivalent knowledge, avoid duplicate VALIDATED_LEARNING, distinguish CASE/PRECEDENT/LEARNING_CANDIDATE/VALIDATED_LEARNING/CONCEPTUAL_KNOWLEDGE/INSTRUCTIONAL_KNOWLEDGE/RULE, and verify architecture continuity. For budget-learning tasks, inspect SO → PTS Técnica → Orçamento → PTS Pós and memory-of-calculation evidence where available. Do not commit, push, create a PR or merge. If corrections are needed, list precise corrective actions. Write elo-merge-dossier.md. End with exactly one line: ELO_DECISION=APPROVE_COMMIT or ELO_DECISION=CORRECT or ELO_DECISION=BLOCK.

      - name: Parse ELO decision
        id: elo_gate
        shell: bash
        run: |
          set -euo pipefail
          decision="$(grep -E 'ELO_DECISION=(APPROVE_COMMIT|CORRECT|BLOCK)' elo-governance.txt | tail -n1 || true)"
          echo "$decision" | tee elo-decision.txt
          [[ -n "$decision" ]] || { echo 'Missing ELO decision'; exit 1; }
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          if [[ "$decision" == "ELO_DECISION=BLOCK" ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "ELO blocked the learning/execution before Commit. No persistence was performed."
            exit 1
          fi

      - name: ELO correction loop
        if: steps.elo_gate.outputs.decision == 'ELO_DECISION=CORRECT'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          prompt: |
            Read elo-governance.txt, AGENTS.md, the bridge contract and the task. Apply only the corrective actions identified by ELO. Preserve canonical architecture and responsibility boundaries. Do not create parallel capabilities, routers, memories, workflows, gates or sources of truth. Do not commit, push, create a PR, merge, or write to main. Re-run validation. Leave the workspace ready for another ELO governance cycle.

      - name: Re-run ELO governance after correction
        if: steps.elo_gate.outputs.decision == 'ELO_DECISION=CORRECT'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          output-file: elo-governance-final.txt
          prompt: |
            Perform the final ELO governance review after corrections. Read the task, AGENTS.md, bridge contract, prior dossier and current diff. Re-check canonical ownership and duplicate/parallel responsibility across capabilities, routers, memories, workflows, gates and sources of truth. Supabase remains consultative only. Confirm cognitive MERGE readiness, knowledge classification, duplicate prevention, acceptance criteria and absence of unauthorized persistence. Do not edit. End with exactly one line: ELO_DECISION=APPROVE_COMMIT or ELO_DECISION=BLOCK.

      - name: Resolve final ELO Commit gate
        id: final_elo_gate
        shell: bash
        env:
          FIRST: ${{ steps.elo_gate.outputs.decision }}
        run: |
          set -euo pipefail
          if [[ "$FIRST" == "ELO_DECISION=APPROVE_COMMIT" ]]; then
            final="$FIRST"
          else
            final="$(grep -E 'ELO_DECISION=(APPROVE_COMMIT|BLOCK)' elo-governance-final.txt | tail -n1 || true)"
          fi
          echo "$final" | tee elo-final-decision.txt
          [[ "$final" == "ELO_DECISION=APPROVE_COMMIT" ]] || { gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "ELO final gate blocked Commit. Issue remains pending."; exit 1; }

      - name: Select Virtual Laboratory for governed learning
        id: lab_scope
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title,body --jq '.body // ""')"
          title="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title --jq '.title')"
          if grep -Eiq 'orçamento|orcamento|PTS Técnica|PTS Pós|aprendizado|memória de cálculo|formação de preço|excedente|precedente' <<<"$title $body"; then
            echo "BUDGET_LEARNING=true" >> "$GITHUB_ENV"
          else
            echo "BUDGET_LEARNING=false" >> "$GITHUB_ENV"
          fi

      - name: Virtual Laboratory - budget learning gate
        if: env.BUDGET_LEARNING == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          model: ${{ vars.CODEX_MODEL || 'gpt-5.5' }}
          effort: ${{ vars.CODEX_EFFORT || 'high' }}
          output-file: virtual-lab-report.txt
          prompt: |
            Act as the ELO Virtual Laboratory. This is a PRE-COMMIT gate. Do not modify canonical production behavior. Test the proposed budget-learning change using available repository evidence and fixtures. Run relevant regression, historical/synthetic scenario, consistency, duplicate-learning, architecture-continuity and governance tests. For budget learning, compare SO → PTS Técnica → Orçamento → PTS Pós and validate calculation logic as entrada → fonte → premissa → fórmula → subcálculo → resultado → validação where applicable. Verify PRECEDENT is not promoted to RULE and VALIDATED_LEARNING is not duplicated. Write virtual-lab-report.md with tests, evidence and failures. End with exactly one line: LAB_DECISION=PASS or LAB_DECISION=FAIL or LAB_DECISION=REVIEW.

      - name: Virtual Laboratory gate result
        id: lab_gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUDGET_LEARNING" != 'true' ]]; then
            echo 'LAB_DECISION=NOT_REQUIRED' | tee lab-decision.txt
            exit 0
          fi
          decision="$(grep -E 'LAB_DECISION=(PASS|FAIL|REVIEW)' virtual-lab-report.txt | tail -n1 || true)"
          echo "$decision" | tee lab-decision.txt
          [[ "$decision" == 'LAB_DECISION=PASS' ]] || { gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Virtual Laboratory did not pass: $decision. No Commit/PR/Merge executed. Issue returns to ELO correction loop."; exit 1; }
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Virtual Laboratory PASS. ELO Commit gate remains valid."

      - name: Verify canonical ELO commit authorization
        id: commit_authz
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "Missing Supabase read credential; canonical commit authorization is required."; exit 1; }
          binding="$(curl -fsS "$SUPABASE_URL/rest/v1/elo_operator_github_bindings?github_user_id=eq.${GITHUB_ACTOR_ID}&repository_full_name=eq.${REPO}&active=eq.true&select=binding_id" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")"
          binding_id="$(jq -r '.[0].binding_id // empty' <<<"$binding")"
          test -n "$binding_id" || { echo "elo-commit-authorized binding not found."; exit 1; }
          grants="$(curl -fsS "$SUPABASE_URL/rest/v1/elo_authorization_grants?binding_id=eq.${binding_id}&authorization_state=eq.elo-commit-authorized&operation=eq.commit&repository_full_name=eq.${REPO}&revoked_at=is.null&expires_at=gt.$(date -u +%Y-%m-%dT%H:%M:%SZ)&select=grant_id,expires_at&order=issued_at.desc&limit=1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")"
          jq -e 'length > 0' <<<"$grants" >/dev/null || { echo "elo-commit-authorized grant not found or expired."; exit 1; }
          echo "$grants" > commit-authorization.json
      - name: Commit after ELO approval and required laboratory gate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ELO Codex Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "feat(elo): governed ${TASK_ID}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Confirm commit and create PR
        if: success()
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          test -n "${COMMIT_SHA:-}"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "Commit ${COMMIT_SHA} confirmado após ELO APPROVE_COMMIT e gates de validação. Criando PR para revisão/autorização de merge."
          pr_url="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "${TASK_ID}: governed ELO execution" --body "ELO governed execution. Supabase consultative memory only. ELO APPROVE_COMMIT precedes commit. Canonical reuse/anti-duplication reconciliation is mandatory. Budget-learning changes require Virtual Laboratory PASS before commit. Merge is not performed by this workflow; merge authority remains subject to the canonical ELO authorization and repository governance boundaries.")"
          echo "PR_URL=$pr_url" >> "$GITHUB_ENV"

      - name: Register PR awaiting authorized merge
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${PR_URL##*/}"
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Unable to resolve PR number for PR-ready evidence."; exit 1; }
          gh pr comment "$PR_URL" --repo "$REPO" --body "ELO execution cycle reached PR-ready state. Commit ${COMMIT_SHA} passed ELO and applicable laboratory gates. Merge is intentionally not executed by this workflow; MERGE_OPERATIONAL requires the canonical authenticated operator binding and all repository/ELO merge gates. ELO_PR_READY_V2=1 ELO_AGENT_LOOP_RUN_ID=${GITHUB_RUN_ID} ELO_AGENT_LOOP_PR_NUMBER=${PR_NUMBER} ELO_AGENT_LOOP_MODE=CREATE_FROM_ISSUE ELO_HEAD_SHA=${COMMIT_SHA} ELO_RESOURCE_ID=pr:${PR_NUMBER}@${COMMIT_SHA}"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "ELO loop reached PR-ready state: diagnosis → correction → validation → ELO governance → APPROVE_COMMIT → Commit → PR. Awaiting authorized merge; no automatic merge or issue closure performed."


  attest-existing-pr:
    name: Attest existing PR
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr_number != '') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'elo/approve-merge')
    permissions:
      contents: read
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve immutable PR target
        id: target
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "A numeric PR number is required."; exit 1; }
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json number,state,isDraft,baseRefName,headRefOid,mergeable,mergeStateStatus,reviewDecision,reviews)"
          jq -e '.state == "OPEN" and .isDraft == false and .baseRefName == "main"' <<<"$pr_json" >/dev/null
          head_sha="$(jq -r '.headRefOid' <<<"$pr_json")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid PR head SHA."; exit 1; }
          expected="${EXPECTED_HEAD_SHA:-${EVENT_HEAD_SHA:-}}"
          if [[ -n "$expected" && "$expected" != "$head_sha" ]]; then
            echo "Existing PR head changed before attestation: expected=$expected actual=$head_sha"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "resource_id=pr:$PR_NUMBER@$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout canonical repository only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare attestation evidence
        run: mkdir -p automation/audit-output

      - name: Verify required GitHub checks
        shell: bash
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          checks="$(gh pr checks "$PR_NUMBER" --repo "$REPO" --required --json name,state,bucket)"
          echo "$checks"
          jq -e 'length > 0 and all(.[]; .bucket == "pass")' <<<"$checks" >/dev/null

      - name: Verify Evolution Gate for immutable head
        shell: bash
        env:
          TARGET_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$TARGET_HEAD_SHA&per_page=100")"
          jq -e '[.workflow_runs[]? | select(.name == "ELO Evolution Gate" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | length > 0' --arg sha "$TARGET_HEAD_SHA" <<<"$runs" >/dev/null

      - name: Canonical repository reconciliation
        shell: bash
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only > automation/audit-output/changed-paths.txt
          python - <<'PY'
          import json
          from pathlib import Path
          from automation.tasks.elo_canonical_reconciliation import event_facts, reconcile_repository

          changed = [line.strip() for line in Path("automation/audit-output/changed-paths.txt").read_text().splitlines() if line.strip()]
          terms = []
          for path in changed:
              stem = Path(path).stem.replace("-", "_").lower()
              if len(stem) >= 3:
                  terms.append(stem)
          evidence = reconcile_repository(".", changed, terms)
          payload = {
              "changed_paths": list(evidence.changed_paths),
              "candidates": list(evidence.candidates),
              "references": list(evidence.references),
              "owners": list(evidence.owners),
              "source_of_truth": evidence.source_of_truth,
              "canonical_identity": evidence.canonical_identity,
              "duplicate_or_parallel": evidence.duplicate_or_parallel,
              "reuse_analysis_complete": evidence.reuse_analysis_complete,
              "decision": evidence.decision,
              "waiting_for_evidence": evidence.waiting_for_evidence,
              "reasons": list(evidence.reasons),
              "event_facts": event_facts(evidence),
          }
          Path("automation/audit-output/reconciliation.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload, indent=2))
          PY
          jq -e '.reuse_analysis_complete == true and .waiting_for_evidence == false and .duplicate_or_parallel == false' automation/audit-output/reconciliation.json >/dev/null

      - name: Revalidate immutable head and reviews
        shell: bash
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          current="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,isDraft,baseRefName,headRefOid,reviewDecision,reviews)"
          jq -e --arg sha "$TARGET_HEAD_SHA" '
            .state == "OPEN"
            and .isDraft == false
            and .baseRefName == "main"
            and .headRefOid == $sha
            and ((.reviewDecision // "") != "CHANGES_REQUESTED")
            and ([.reviews[]? | select(.state == "CHANGES_REQUESTED" or .state == "PENDING")] | length == 0)
          ' <<<"$current" >/dev/null

      - name: Publish authenticated PR-ready V2
        shell: bash
        env:
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          TARGET_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          RESOURCE_ID: ${{ steps.target.outputs.resource_id }}
        run: |
          set -euo pipefail
          current_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          [[ "$current_sha" == "$TARGET_HEAD_SHA" ]] || { echo "PR head changed before PR-ready publication."; exit 1; }
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "ELO execution cycle reached PR-ready state. Commit ${TARGET_HEAD_SHA} passed ELO and applicable laboratory gates. Merge is intentionally not executed by this workflow; MERGE_OPERATIONAL requires the canonical authenticated operator binding and all repository/ELO merge gates. ELO_PR_READY_V2=1 ELO_AGENT_LOOP_RUN_ID=${GITHUB_RUN_ID} ELO_AGENT_LOOP_PR_NUMBER=${PR_NUMBER} ELO_AGENT_LOOP_MODE=ATTEST_EXISTING_PR ELO_HEAD_SHA=${TARGET_HEAD_SHA} ELO_RESOURCE_ID=${RESOURCE_ID}"
