name: ELO Conditional Pointer Lab

on:
  pull_request:
    paths:
      - 'src/elo/agent_intake/conditional_pointer.py'
      - 'tests/agent_intake/test_conditional_pointer.py'
      - '.github/workflows/elo-conditional-pointer-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Validate information-to-capability pointer
        run: python -m pytest -q tests/agent_intake/test_conditional_pointer.py
