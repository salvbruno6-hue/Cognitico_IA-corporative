name: ELO Conversation Bridge

on:
  push:
    paths:
      - 'events/conversations/inbox/*.json'
      - 'src/elo/core/**'
      - 'scripts/bridge_ingest.py'
      - 'scripts/solicitation_memory_project.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Validate bridge tests
        run: python -m pytest tests/core/test_conversation_bridge.py

      - name: Ingest authorized conversation events
        run: python scripts/bridge_ingest.py

      - name: Project solicitation-scoped memory
        run: python scripts/solicitation_memory_project.py

      - name: Persist conversation and solicitation memory projections
        run: |
          git config user.name 'ELO Conversation Bridge'
          git config user.email 'actions@users.noreply.github.com'
          git add memory/evolution memory/solicitations
          if git diff --cached --quiet; then
            echo 'No new memory projections.'
          else
            git commit -m 'chore(memory): persist conversation and solicitation projections'
            git push
          fi
