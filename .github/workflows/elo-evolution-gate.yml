name: ELO Evolution Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validation:
    name: Canonical validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package, tests and agentic runtime
        run: python -m pip install -e ".[test,agentic]"
      - name: Compile source
        run: python -m compileall src
      - name: Run full test suite
        run: python -m pytest -q

  symbiont-capability-filter:
    name: Symbiont deep capability evolution filter
    needs: validation
    if: needs.validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package, tests and agentic runtime
        run: python -m pip install -e ".[test,agentic]"
      - name: Enforce owner, objective and net-gain filter
        run: python scripts/run_symbiont_capability_filter.py
      - name: Publish filter boundary
        if: always()
        run: |
          echo "The filter does not promote capabilities automatically."
          echo "Parallel owners, duplicate capabilities, objective drift and unproven gain fail closed."

  hermes-13-loop:
    name: Hermes 13 governed implementation loop
    needs: validation
    if: needs.validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package, tests and agentic runtime
        run: python -m pip install -e ".[test,agentic]"
      - name: Execute controlled Hermes 13 loop
        run: python scripts/run_hermes_13_implementation_loop.py
      - name: Publish loop evidence
        if: always()
        run: |
          echo "Hermes 13 loop execution is evidence-only."
          echo "No promotion, production execution, or canonical mutation is authorized by this job."

  evolution-handoff:
    name: ELO decision handoff
    needs: [validation, symbiont-capability-filter, hermes-13-loop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish ELO gate state
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          FILTER_RESULT: ${{ needs.symbiont-capability-filter.result }}
          HERMES_LOOP_RESULT: ${{ needs.hermes-13-loop.result }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$VALIDATION_RESULT" = "success" ] && [ "$FILTER_RESULT" = "success" ] && [ "$HERMES_LOOP_RESULT" = "success" ]; then
            STATE="READY_FOR_ELO_REVIEW"
            MESSAGE="Validação técnica, filtro profundo da Simbionte e loop Hermes passaram. O ELO pode avaliar a introdução sem presumir promoção automática."
          else
            STATE="ELO_AWAITING_DECISION"
            MESSAGE="A validação técnica, o filtro profundo da Simbionte ou o loop Hermes falhou. O ELO deve corrigir, adaptar, preservar como observação ou bloquear sem criar autoridade paralela."
          fi

          if [ -n "$PR_NUMBER" ]; then
            cat > /tmp/comment.md <<EOF
          ## ELO Evolution Gate

          **Estado:** \`$STATE\`
          **PR:** #$PR_NUMBER
          **Validação técnica:** \`$VALIDATION_RESULT\`
          **Filtro profundo da Simbionte:** \`$FILTER_RESULT\`
          **Loop Hermes 13:** \`$HERMES_LOOP_RESULT\`

          $MESSAGE

          ### Protocolo
          1. Preservar o owner canônico existente.
          2. Rejeitar autoridade paralela, capability duplicada e desvio do objetivo do owner.
          3. Exigir ganho funcional líquido, repetível e atribuído ao candidato.
          4. Separar prova controlada de prova produtiva.
          5. Não promover automaticamente uma mudança de Soul/Core.
          6. O loop Hermes e o filtro não autorizam produção, promoção ou mutação canônica.

          Este comentário é um handoff estruturado para a camada consultiva do ELO/GPT.
          EOF
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
          fi

  external-access-contract:
    name: External access contract
    needs: validation
    if: needs.validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package and tests
        run: python -m pip install -e ".[test,agentic]"
      - name: Run external access security tests
        run: python -m pytest -q tests/security/test_external_access_contract.py tests/security/test_identity_trust.py tests/test_specialist_consultation_boundary.py
