name: ELO Evolution Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validation:
    name: Canonical validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package, tests and agentic runtime
        run: python -m pip install -e ".[test,agentic]"
      - name: Compile source
        run: python -m compileall src
      - name: Run full test suite
        run: python -m pytest -q

  hermes-13-loop:
    name: Hermes 13 governed implementation loop
    needs: validation
    if: needs.validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package, tests and agentic runtime
        run: python -m pip install -e ".[test,agentic]"
      - name: Execute controlled Hermes 13 loop
        run: python scripts/run_hermes_13_implementation_loop.py
      - name: Publish loop evidence
        if: always()
        run: |
          echo "Hermes 13 loop execution is evidence-only."
          echo "No promotion, production execution, or canonical mutation is authorized by this job."

  evolution-handoff:
    name: ELO decision handoff
    needs: [validation, hermes-13-loop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish ELO gate state
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          HERMES_LOOP_RESULT: ${{ needs.hermes-13-loop.result }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$VALIDATION_RESULT" = "success" ] && [ "$HERMES_LOOP_RESULT" = "success" ]; then
            STATE="READY_FOR_ELO_REVIEW"
            MESSAGE="Validação técnica e execução controlada do loop Hermes 13 passaram. O ELO pode avaliar compatibilidade canônica, conflitos, evidências e necessidade de decisão humana."
          else
            STATE="ELO_AWAITING_DECISION"
            MESSAGE="A validação técnica ou a execução controlada do loop Hermes 13 falhou. O ELO deve analisar as falhas, comparar com contratos canônicos e decidir: corrigir, adaptar, preservar como alternativa ou bloquear."
          fi

          if [ -n "$PR_NUMBER" ]; then
            cat > /tmp/comment.md <<EOF
          ## ELO Evolution Gate

          **Estado:** \`$STATE\`
          **PR:** #$PR_NUMBER
          **Validação técnica:** \`$VALIDATION_RESULT\`
          **Loop Hermes 13:** \`$HERMES_LOOP_RESULT\`

          $MESSAGE

          ### Protocolo
          1. Comparar alteração com a identidade e arquitetura canônicas.
          2. Identificar reutilização, duplicidade, conflito e impacto.
          3. Separar falha técnica de conflito arquitetural.
          4. Se houver decisão necessária, registrar a questão e as alternativas.
          5. Não promover automaticamente uma mudança de Soul/Core por causa de uma falha de CI.
          6. O loop Hermes 13 não autoriza produção, promoção ou mutação canônica.

          Este comentário é um handoff estruturado para a camada consultiva do ELO/GPT.
          EOF
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
          fi

  external-access-contract:
    name: External access contract
    needs: validation
    if: needs.validation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package and tests
        run: python -m pip install -e ".[test,agentic]"
      - name: Run external access security tests
        run: python -m pytest -q tests/security/test_external_access_contract.py tests/security/test_identity_trust.py tests/test_specialist_consultation_boundary.py
